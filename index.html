    chartInstances.dashWorkloadTimelineChart = new Chart(timelineCanvas, {
      type: 'bubble',
      data: {
        datasets: [{
          label: 'Tasks',
          data: points,
          backgroundColor: points.map(p => levelFill[p.level]),
          borderColor: points.map(p => levelBorder[p.level]),
          borderWidth: 1.5,
        }]
      },
      plugins: [todayLinePlugin],
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: ctx => { const p = points[ctx.dataIndex]; return [` ${p.taskName} (${p.styleNo})`, ` Due ${fmtDate(p.dueDate)} · ${p.effort} effort-day${p.effort!==1?'s':''}`]; } } }
        },
        scales: {
          x: {
            title: { display: true, text: 'Days from today (dashed line) — negative means overdue', font: chartBaseFont(), color: '#6B7385' },
            ticks: { font: chartBaseFont(), color: '#6B7385', callback: v => v===0 ? 'Today' : (v>0?'+':'')+v+'d' },
            grid: { color: '#EFEBE0' }
          },
          y: {
            type: 'category', labels: people.map(p => userName(p.userId)), offset: true,
            ticks: { font: chartBaseFont(), color: '#2B3A55' }, grid: { color: '#EFEBE0' }
          }
        }
      }
    });
  }
}

function renderOrderCard(order){
  const expanded = !!currentOrderExpanded[order.id];
  const total = order.tasks.length;
  const done = order.tasks.filter(t=>!isOpenTask(t)).length;
  const overdue = order.tasks.filter(t=> taskStatusComputed(t)==='Overdue').length;
  const daysLeft = daysBetween(today(), order.pcd);
  const rag = orderRAG(order);
  const crit = criticalTask(order);

  const materialTasks = order.tasks.filter(t=>t.materialType);
  let readinessHtml = '';
  if(materialTasks.length){
    const withPct = materialTasks.map(t=>({t, pct: qtyPercent(t)}));
    const known = withPct.filter(x=>x.pct!==null);
    const completeCount = known.filter(x=>x.pct>=100).length;
    const worst = known.length ? Math.min(...known.map(x=>x.pct)) : null;
    // Kept in sync with qtyReadyClass()'s own thresholds (100 / 30) so the label text
    // and the badge color it's paired with never disagree on severity.
    const readyLabel = worst===null ? 'Awaiting receipt' : worst>=100 ? 'Ready for production' : worst>=30 ? 'Nearly ready — check shortfall' : 'Not enough material received';
    const readyClass = worst===null ? 'pending' : qtyReadyClass(worst);
    readinessHtml = `<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
      <span class="badge ${readyClass}">${readyLabel}</span>
      <span class="badge pending">${completeCount}/${materialTasks.length} item${materialTasks.length>1?'s':''} received in full</span>
    </div>`;
  }

  const editingPcd = editingPcdOrderId === order.id;

  return `<div class="order-card">
    <div class="order-card-head">
      <div>
        <div class="order-title"><span class="rag-dot ${rag}" title="${ragLabel(rag)}"></span> ${order.styleNo}${order.season?` <span class="dept-tag" style="background:var(--brass-soft);color:#7A5A16;">${order.season}</span>`:''} — ${order.item}</div>
        <div class="order-meta">${buyerName(order.buyerId)}${order.poNumber?' · PO '+order.poNumber:''}${order.templateSetName?' · '+order.templateSetName:''} · Qty ${order.qty || '—'} · ${done}/${total} tasks done${overdue?` · <span style="color:var(--thread-red);">${overdue} overdue</span>`:''}</div>
      </div>
      <div style="text-align:right;">
        ${editingPcd ? `
          <div style="display:flex;gap:6px;align-items:center;">
            <input type="date" id="editPcdInput_${order.id}" value="${order.pcd}" style="width:150px;">
            <button class="btn small" data-save-pcd="${order.id}">Save</button>
            <button class="btn ghost small" data-cancel-edit-pcd="1">Cancel</button>
          </div>
        ` : `
          <div class="pcd-pill">PCD ${fmtDate(order.pcd)}</div>
          <button class="btn ghost small" style="margin-top:6px;" data-edit-pcd="${order.id}">Edit PCD</button>
        `}
        <div class="order-meta" style="margin-top:4px;">${daysLeft>=0 ? daysLeft+' days left' : Math.abs(daysLeft)+' days past PCD'}</div>
      </div>
    </div>
    ${crit ? `<div style="margin-top:6px;"><span class="critical-badge">⚡ Critical path</span> <span style="font-size:12.5px;color:var(--ink-soft);">${crit.name} — ${fmtDate(opDate(crit))} (${userName(crit.assignedTo)})</span></div>` : ''}
    ${renderGanttTimeline(order)}
    ${readinessHtml}
    <div class="row-actions" style="margin-top:8px;">
      <button class="btn ghost small" data-toggle-order="${order.id}">${expanded ? 'Hide tasks' : 'View tasks'}</button>
      <button class="btn ghost small" data-export-order-pdf="${order.id}">Export PDF</button>
      <button class="btn ghost small" data-export-order-excel="${order.id}">Export Excel</button>
      <button class="btn danger small" data-delete-order="${order.id}">Delete order</button>
    </div>
    ${expanded ? renderOrderTasks(order) : ''}
  </div>`;
}

function renderOrderTasks(order){
  const buyerUsers = DATA.users.filter(u=>u.role==='member' && userBuyerIds(u).includes(order.buyerId));
  const tnaOnly = order.tasks.filter(t=>!t.materialType);
  const rows = tnaOnly.slice().sort((a,b)=> opDate(a)<opDate(b)?-1:1).map(t => {
    // Show everyone on this buyer's team, grouped by department — except members whose
    // permissions restrict them to specific tasks that don't include this one (unless
    // they're already assigned here, so a mismatch doesn't silently vanish from the list).
    const isEligible = u => !u.allowedTaskNames || u.allowedTaskNames.length===0 || u.allowedTaskNames.includes(t.name) || t.assignedTo===u.id;
    const sameDept = buyerUsers.filter(u=>u.dept===t.dept && isEligible(u));
    const otherDept = buyerUsers.filter(u=>u.dept!==t.dept && isEligible(u));
    const optionsHtml = `
      ${sameDept.length ? `<optgroup label="${t.dept} (matches task)">${sameDept.map(u=>`<option value="${u.id}" ${t.assignedTo===u.id?'selected':''}>${u.name}</option>`).join('')}</optgroup>` : ''}
      ${otherDept.length ? `<optgroup label="Other departments">${otherDept.map(u=>`<option value="${u.id}" ${t.assignedTo===u.id?'selected':''}>${u.name} (${u.dept})</option>`).join('')}</optgroup>` : ''}
    `;
    const delay = taskDelayDays(t);
    const slip = estimateSlippageDays(t);
    const dependsOnTask = t.dependsOn ? order.tasks.find(x=>x.id===t.dependsOn) : null;
    return `<tr>
      <td>${t.name}${dependsOnTask ? `<div class="hint" style="margin-top:2px;">⛓ after: ${dependsOnTask.name}</div>` : ''}</td>
      <td><span class="dept-tag dept-${t.dept}">${t.dept}</span></td>
      <td>
        <select class="assignee-select" data-order="${order.id}" data-task="${t.id}">
          <option value="">Unassigned</option>
          ${optionsHtml}
        </select>
      </td>
      <td class="mono readonly-cell" title="Calculated once from PCD + template lead time — never edited directly">${fmtDate(t.plannedDate)}</td>
      <td>
        <input type="date" class="expdate-input" data-order="${order.id}" data-task="${t.id}" value="${t.expectedDate || t.plannedDate || ''}">
        ${slip>0 ? `<div class="hint" style="color:var(--brass);margin-top:2px;">Slipping ${slip}d vs plan</div>` : ''}
        ${t.expectedDateManuallySet ? `<div class="hint" style="margin-top:2px;">Manually updated</div>` : ''}
      </td>
      <td><input type="date" class="actualdate-input" data-order="${order.id}" data-task="${t.id}" value="${t.actualDate || ''}"></td>
      <td>
        <select class="status-select" data-order="${order.id}" data-task="${t.id}">
          ${statusOptionsHtml(t.status)}
        </select>
        <div class="hint" style="margin-top:3px;"><span class="badge ${taskBadgeClass(t)}">${statusDisplayText(t)}</span></div>
      </td>
      <td class="mono" style="color:${delay>0?'var(--thread-red)':delay<0?'var(--green)':'var(--muted)'};">${delay>0?'+':''}${delay || '—'}</td>
      <td><input type="text" class="remarks-input" placeholder="Add a note…" data-order="${order.id}" data-task="${t.id}" value="${t.remarks ? t.remarks.replace(/"/g,'&quot;') : ''}">${taskHistoryHtml(t)}</td>
      <td><button class="btn small" data-save-task-row="${t.id}" data-order="${order.id}">Save</button></td>
    </tr>`;
  }).join('');

  return `<div class="divider"></div>
  ${buyerUsers.length===0 ? `<div class="lock-note">No team members have been added for ${buyerName(order.buyerId)} yet, so every task shows "Unassigned". Go to Buyers &amp; Team and add people under this buyer to assign owners here.</div>` : ''}
  <div class="xgrid">
  <table>
    <thead><tr><th>Task</th><th>Department</th><th>Owner</th><th>System Estimated</th><th>Expected Date</th><th>Actual Date</th><th>Status</th><th>Delay</th><th>Remarks</th><th></th></tr></thead>
    <tbody>${rows}</tbody>
  </table>
  </div>
  ${renderBomPanel(order)}`;
}

/* ---- BOM paste-and-parse (Excel copy/paste → item-wise in-house dates) ---- */
/* ---- Real spreadsheet-style paste grid (used for BOM and Task Template bulk-add) ----
   A genuine row/column grid you click into and paste directly, like Excel — not a text box.
   Whatever ends up in the cells gets converted to tab-separated text and run through the
   same tested parseBomPaste/parseTemplatePaste logic used by file upload. */
let excelGridStore = {}; // gridId -> array of arrays of cell strings
function getGridData(gridId){
  if(!excelGridStore[gridId]) excelGridStore[gridId] = [];
  return excelGridStore[gridId];
}
function clearGridData(gridId){ excelGridStore[gridId] = []; }
function colLetter(i){
  let s = '';
  i = i + 1;
  while(i > 0){ const rem = (i-1) % 26; s = String.fromCharCode(65+rem) + s; i = Math.floor((i-1)/26); }
  return s;
}
function renderExcelGrid(gridId, minRows, minCols){
  const data = getGridData(gridId);
  const cols = Math.max(minCols, ...data.map(r=>r.length), 1);
  const rows = Math.max(minRows, data.length);
  let html = `<div class="excel-grid-wrap"><table class="excel-grid"><thead><tr><th></th>`;
  for(let c=0;c<cols;c++) html += `<th>${colLetter(c)}</th>`;
  html += `</tr></thead><tbody>`;
  for(let r=0;r<rows;r++){
    html += `<tr><th>${r+1}</th>`;
    for(let c=0;c<cols;c++){
      const val = (data[r] && data[r][c]!==undefined) ? data[r][c] : '';
      html += `<td><input class="excel-cell" data-grid="${gridId}" data-row="${r}" data-col="${c}" value="${String(val).replace(/"/g,'&quot;')}"></td>`;
    }
    html += `</tr>`;
  }
  html += `</tbody></table></div>`;
  return html;
}
function gridDataToTsv(gridId){
  const data = getGridData(gridId);
  const lines = data
    .map(row => {
      // trim trailing empty cells so short rows don't drag blank tabs along
      let lastFilled = -1;
      row.forEach((c,i)=>{ if(c && String(c).trim()!=='') lastFilled = i; });
      return row.slice(0, lastFilled+1).map(c=>c===undefined?'':c).join('\t');
    })
    .filter(line => line.trim().length>0);
  return lines.join('\n');
}
function fillGridFromPaste(gridId, startRow, startCol, text){
  const data = getGridData(gridId);
  const rows = text.replace(/\r/g,'').split('\n');
  rows.forEach((rowText, ri) => {
    if(ri===rows.length-1 && rowText==='') return; // trailing newline from clipboard
    const r = startRow + ri;
    if(!data[r]) data[r] = [];
    const cells = rowText.split('\t');
    cells.forEach((cell, ci) => { data[r][startCol+ci] = cell; });
  });
}

let bomPreview = null; // {orderId, rows:[{itemName, requiredQty, unit, dateSource, plannedDate, supplier, error}]}

function excelSerialToISO(n){
  // Excel's day-zero is 1899-12-30
  const ms = Math.round((n - 25569) * 86400 * 1000);
  const d = new Date(ms);
  if(isNaN(d.getTime())) return null;
  return d.toISOString().slice(0,10);
}

function parseFlexibleDate(raw){
  if(!raw) return null;
  const s = String(raw).trim();
  if(!s) return null;
  // Pure number → could be an Excel serial date
  if(/^\d{4,6}(\.\d+)?$/.test(s)){
    const n = parseFloat(s);
    if(n > 20000 && n < 60000) return excelSerialToISO(n);
  }
  // yyyy-mm-dd
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m) return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  // dd/mm/yyyy or dd-mm-yyyy (day-first, most common outside the US)
  m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if(m){
    let [_, a, b, y] = m;
    if(y.length===2) y = (parseInt(y,10) < 50 ? '20' : '19') + y;
    let day = parseInt(a,10), month = parseInt(b,10);
    if(month > 12 && day <= 12){ const t=day; day=month; month=t; } // swap if it's clearly month-first data
    if(month>=1 && month<=12 && day>=1 && day<=31) return `${y}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  }
  // Fall back to the engine's own parser (handles things like "08-Dec-2026")
  const d = new Date(s);
  if(!isNaN(d.getTime())) return d.toISOString().slice(0,10);
  return null;
}

function findCol(headerCells, matchers){
  for(const m of matchers){
    const idx = headerCells.findIndex(c => m(c.trim().toLowerCase()));
    if(idx !== -1) return idx;
  }
  return -1;
}

function tokenizeFixedWidth(text, ncols){
  // Reconstructs rows using a known column count, so a literal newline INSIDE an
  // Excel cell (common in multi-line comment/label cells) doesn't get mistaken
  // for a row break — it only counts as a row break once that many columns are filled.
  const rows = [];
  let currentRow = [];
  let currentCell = '';
  for(let i=0;i<text.length;i++){
    const ch = text[i];
    if(ch === '\t'){
      currentRow.push(currentCell); currentCell = '';
    } else if(ch === '\n' || ch === '\r'){
      if(ch === '\r' && text[i+1] === '\n') i++;
      if(currentRow.length + 1 >= ncols){
        currentRow.push(currentCell); rows.push(currentRow);
        currentRow = []; currentCell = '';
      } else {
        currentCell += ' '; // newline landed inside a wrapped cell — treat as a space, not a row break
      }
    } else {
      currentCell += ch;
    }
  }
  if(currentCell.length>0 || currentRow.length>0){ currentRow.push(currentCell); rows.push(currentRow); }
  return rows.map(r => r.map(c=>c.trim()));
}

function parseBomPaste(text, pcd, defaultLeadDays){
  const naiveLines = text.split(/\r?\n/);
  if(naiveLines.every(l=>l.trim().length===0)) return [];

  // Look for a header row within the first several lines (skip title/banner rows above it).
  // Header detection uses a naive split — assumes the header row itself isn't a wrapped cell, which holds in practice.
  const headerKeywords = ['item','uom','unit','qty','quantity','supplier','date','description'];
  let headerIdx = -1;
  for(let i=0;i<Math.min(6, naiveLines.length);i++){
    const cells = naiveLines[i].split('\t').map(c=>c.trim());
    const matches = cells.filter(c => headerKeywords.some(k => c.toLowerCase().includes(k))).length;
    if(matches >= 2){ headerIdx = i; break; }
  }

  let itemIdx, qtyIdx, unitIdx, dateIdx, supplierIdx;
  let dataRows;

  if(headerIdx !== -1){
    const header = naiveLines[headerIdx].split('\t').map(c=>c.trim());
    itemIdx = findCol(header, [c=>c==='item', c=>c.includes('item')&&!c.includes('description')&&!c.includes('code')]);
    qtyIdx = findCol(header, [c=>c.includes('ordered qty'), c=>c.includes('gmt order qty'), c=>c.includes('qty')&&!c.includes('cons'), c=>c.includes('quantity')]);
    unitIdx = findCol(header, [c=>c==='uom', c=>c.includes('uom'), c=>c.includes('unit')&&!c.includes('unitcost')]);
    dateIdx = findCol(header, [c=>c.includes('i/h date'), c=>c.includes('inhouse'), c=>c.includes('in house'), c=>c.includes('expected')&&c.includes('date'), c=>c.includes('date')]);
    supplierIdx = findCol(header, [c=>c.includes('supplier'), c=>c.includes('vendor')]);
    // Tokenize everything after the header using a fixed column width, so wrapped
    // multi-line cells further down don't throw off row alignment.
    const remainderText = naiveLines.slice(headerIdx+1).join('\n');
    dataRows = tokenizeFixedWidth(remainderText, header.length);
  } else {
    // No recognizable header — fall back to a simple fixed layout: Item, Qty, Unit, Lead days, Supplier
    itemIdx=0; qtyIdx=1; unitIdx=2; dateIdx=-1; supplierIdx=4;
    dataRows = naiveLines.filter(l=>l.trim().length>0).map(l => l.split('\t').map(c=>c.trim()));
  }
  const leadIdx = (headerIdx===-1) ? 3 : -1; // only the simple fallback format has an explicit lead-time column

  // Forward-fill item/date/supplier (Excel merged cells paste as blank on continuation rows)
  // and group rows that belong to the same item, summing quantity across size/color variants.
  const groups = [];
  const groupIndex = {};
  let lastItemName = '';

  dataRows.forEach(cells => {
    if(cells.every(c=>!c)) return; // fully blank row
    const rawItem = itemIdx>=0 ? (cells[itemIdx]||'').trim() : '';
    const isNewItem = rawItem.length > 0;
    const itemName = isNewItem ? rawItem : lastItemName;
    if(!itemName) return; // nothing to attach a blank continuation row to
    if(isNewItem) lastItemName = itemName;

    const qtyRaw = qtyIdx>=0 ? (cells[qtyIdx]||'').replace(/,/g,'').trim() : '';
    const qty = parseFloat(qtyRaw);
    const unit = unitIdx>=0 ? (cells[unitIdx]||'').trim() : '';
    const supplier = supplierIdx>=0 ? (cells[supplierIdx]||'').trim() : '';
    const dateRaw = dateIdx>=0 ? (cells[dateIdx]||'').trim() : '';
    const leadRaw = leadIdx>=0 ? (cells[leadIdx]||'').trim() : '';

    let g = groupIndex[itemName];
    if(!g){
      g = {itemName, requiredQty: 0, unit: '', supplier: '', dateRaw: '', leadRaw: ''};
      groupIndex[itemName] = g;
      groups.push(g);
    }
    if(!isNaN(qty)) g.requiredQty += qty;
    if(!g.unit && unit) g.unit = unit;
    if(!g.supplier && supplier) g.supplier = supplier;
    if(!g.dateRaw && dateRaw) g.dateRaw = dateRaw;
    if(!g.leadRaw && leadRaw) g.leadRaw = leadRaw;
  });

  return groups.map(g => {
    let plannedDate = parseFlexibleDate(g.dateRaw);
    let dateSource = plannedDate ? 'date' : null;
    if(!plannedDate){
      let leadDays = parseInt(g.leadRaw, 10);
      if(isNaN(leadDays)) leadDays = defaultLeadDays;
      plannedDate = addDays(pcd, -Math.abs(leadDays||0));
      dateSource = g.leadRaw ? 'lead' : 'default';
    }
    let error = '';
    if(!g.itemName) error = 'Missing item name';
    else if(!g.requiredQty || g.requiredQty<=0) error = 'Missing/invalid required qty';

    return {itemName: g.itemName, requiredQty: g.requiredQty || null, unit: g.unit, supplier: g.supplier, plannedDate, dateSource, error};
  });
}

/* ---- Template bulk paste-and-parse (Admin only — upload a task list from Excel) ---- */
function parseTemplatePaste(text){
  const naiveLines = text.split(/\r?\n/);
  if(naiveLines.every(l=>l.trim().length===0)) return [];

  const headerKeywords = ['task','name','department','dept','days','offset','lead','pcd'];
  let headerIdx = -1;
  for(let i=0;i<Math.min(4, naiveLines.length);i++){
    const cells = naiveLines[i].split('\t').map(c=>c.trim());
    const matches = cells.filter(c => headerKeywords.some(k => c.toLowerCase().includes(k))).length;
    if(matches >= 2){ headerIdx = i; break; }
  }

  let nameIdx, deptIdx, offsetIdx, dataLines;
  if(headerIdx !== -1){
    const header = naiveLines[headerIdx].split('\t').map(c=>c.trim());
    nameIdx = findCol(header, [c=>c.includes('task')||c.includes('name')]);
    deptIdx = findCol(header, [c=>c.includes('dept')||c.includes('department')]);
    offsetIdx = findCol(header, [c=>c.includes('days')||c.includes('offset')||c.includes('lead')]);
    dataLines = naiveLines.slice(headerIdx+1);
  } else {
    nameIdx=0; deptIdx=1; offsetIdx=2;
    dataLines = naiveLines;
  }

  return dataLines.filter(l=>l.trim().length>0).map(line => {
    const cells = line.split('\t').map(c=>c.trim());
    const name = nameIdx>=0 ? (cells[nameIdx]||'').trim() : '';
    let dept = deptIdx>=0 ? (cells[deptIdx]||'').trim() : '';
    // Match to a known department, case-insensitively, so "purchase"/"PURCHASE" etc. all work
    const matchedDept = DEPARTMENTS.find(d => d.toLowerCase() === dept.toLowerCase());
    dept = matchedDept || (DEPARTMENTS.includes(dept) ? dept : DEPARTMENTS[0]);
    const offsetRaw = offsetIdx>=0 ? (cells[offsetIdx]||'').replace(/[^0-9\-]/g,'') : '';
    const offset = parseInt(offsetRaw, 10);

    let error = '';
    if(!name) error = 'Missing task name';
    else if(isNaN(offset)) error = 'Missing/invalid days before PCD';

    return {name, dept, offset: isNaN(offset)?null:offset, error};
  });
}

function renderBomPanel(order){
  if(!isManagerOrAdmin()) return '';
  const bomTasks = order.tasks.filter(t=>t.materialType!==null && t.materialType!==undefined);

  const gridHtml = `<div class="xgrid" style="margin-top:10px;">
    <table>

        <th>Item</th><th>Required qty</th><th>Unit</th><th>Supplier</th>
        <th>Required I/H (PCD)</th><th>Expected date</th><th>Actual received date</th><th>Received qty</th><th>Balance qty</th><th>%</th><th>Remarks</th><th></th>
      </tr></thead>
      <tbody>${bomTasks.map(t=>bomGridRow(order,t)).join('') || `<tr><td colspan="12" style="text-align:center;color:var(--muted);padding:16px;">No BOM items yet — add one or paste from Excel below.</td></tr>`}</tbody>
    </table>
  </div>`;

  const bulkImportHtml = preview ? (() => {
    const validRows = preview.rows.filter(r=>!r.error);
    const invalidRows = preview.rows.filter(r=>r.error);
    return `<div class="xgrid" style="margin-top:10px;">
      <table>
        <thead><tr><th>Item</th><th>Required qty</th><th>Unit</th><th>Supplier</th><th>Required I/H (PCD)</th><th>Expected date</th><th>Source</th><th>Status</th></tr></thead>
        <tbody>
          ${preview.rows.map((r,i) => `<tr style="${r.error?'opacity:.5;':''}">
            <td><input class="bom-preview-item" data-idx="${i}" value="${(r.itemName||'').replace(/"/g,'&quot;')}"></td>
            <td><input class="bom-preview-qty" type="number" data-idx="${i}" value="${r.requiredQty??''}"></td>
            <td><input class="bom-preview-unit" data-idx="${i}" value="${(r.unit||'').replace(/"/g,'&quot;')}"></td>
            <td><input class="bom-preview-supplier" data-idx="${i}" value="${(r.supplier||'').replace(/"/g,'&quot;')}"></td>
            <td class="readonly"><input value="${fmtDate(addDays(order.pcd,-3))}" disabled></td>
            <td><input class="bom-preview-date" type="date" data-idx="${i}" value="${r.plannedDate||''}"></td>
            <td class="readonly"><input value="${r.dateSource==='date'?'from BOM date':r.dateSource==='lead'?'from lead days':'default lead time'}" disabled></td>
            <td class="readonly"><input value="${r.error||'OK'}" disabled></td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
    <div class="row-actions" style="margin-top:12px;">
      <button class="btn" data-import-bom="${order.id}" ${validRows.length===0?'disabled':''}>Add ${validRows.length} item${validRows.length!==1?'s':''} to BOM</button>
      <button class="btn ghost" data-cancel-bom="${order.id}">Cancel</button>
    </div>
    <div class="hint">Edit any cell above before adding — these will be appended to the BOM grid, not replace it. Rows for the same item (size/color variants) were already summed together.</div>`;
  })() : `
    <div class="row-actions" style="margin-bottom:12px;">
      <button class="btn ghost small" data-download-bom-template="1">⬇ Download blank Excel template</button>
      <label class="btn ghost small" style="cursor:pointer;">⬆ Upload filled Excel file
        <input type="file" class="bom-excel-upload" data-order="${order.id}" accept=".xlsx,.xls,.csv" style="display:none;">
      </label>
      <button class="btn ghost small" data-clear-bom-grid="${order.id}">Clear grid</button>
    </div>
    <p class="desc" style="margin-bottom:6px;">Click a cell below and paste (Ctrl+V) directly from Excel — including the header row — the same way you'd paste into a spreadsheet. Or download the template / upload a filled file above instead.</p>
    ${renderExcelGrid('bom_'+order.id, 15, 10)}
    <div class="grid-cols" style="margin-top:10px;grid-template-columns:1fr auto;align-items:end;">
      <div class="field"><label>Fallback lead time if a row has no usable date (days before PCD)</label><input id="bomDefaultLead_${order.id}" type="number" value="30"></div>
      <button class="btn" data-preview-bom="${order.id}">Preview</button>
    </div>`;

  return `<div class="divider"></div>
  <div class="panel" style="background:#fff;box-shadow:none;">
    <div class="flex-between">
      <div>
        <h2 style="font-size:14px;">Bill of materials</h2>
        <p class="desc"><strong>Required I/H date</strong> always matches this order's PCD. <strong>Estimated I/H date</strong> is set here by the Merchandiser/Manager/Admin managing the order. <strong>Actual I/H date</strong> and <strong>received qty</strong> are normally logged by Store from My Tasks, but can be corrected here too.</p>
      </div>
      <button class="btn ghost small" data-add-bom-item="${order.id}">+ Add item</button>
    </div>
    ${gridHtml}
    <div class="divider"></div>
    <h2 style="font-size:13px;">${preview ? 'Preview before adding' : 'Bulk add from Excel'}</h2>
    ${!preview ? `<p class="desc">Select and copy your BOM rows straight from Excel — including the header row — and paste them below. This reads columns like <strong>Item, Ordered Qty (or Gmt Order qty), Uom, Supplier, Expected I/H date</strong> automatically, in whatever order your sheet has them, and sums rows for the same item (e.g. size/color variants) into one line.</p>` : ''}
    ${bulkImportHtml}
  </div>`;
}

/* ---- Buyers & Team ---- */

function renderTemplateBulkAddSection(set, bulkPreviewForThisSet){
  const heading = bulkPreviewForThisSet ? 'Preview before adding' : 'Bulk add tasks from Excel';
  let body;
  if(bulkPreviewForThisSet){
    body = renderTemplatePreviewGrid(bulkPreviewForThisSet, set.id);
  } else {
    body = '<div class="row-actions" style="margin-bottom:10px;">'
      + '<button class="btn ghost small" data-download-tpl-template="1">⬇ Download blank Excel template</button>'
      + '<label class="btn ghost small" style="cursor:pointer;">⬆ Upload filled Excel file'
      + '<input type="file" class="tpl-excel-upload" data-set="' + set.id + '" accept=".xlsx,.xls,.csv" style="display:none;">'
      + '</label>'
      + '<button class="btn ghost small" data-clear-tpl-grid="' + set.id + '">Clear grid</button></div>'
      + '<p class="desc">Click a cell and paste (Ctrl+V) directly from Excel — columns: <strong>Task name, Department, Days before PCD</strong>.</p>'
      + renderExcelGrid('tpl_' + set.id, 10, 6)
      + '<div class="row-actions" style="margin-top:10px;">'
      + '<button class="btn" data-preview-tpl-paste="' + set.id + '">Preview</button>'
      + '</div>';
  }
  return '<div class="divider"></div><h2 style="font-size:13px;">' + heading + '</h2>' + body;
}

// Tasks that (directly or transitively) already depend on taskId — offered as taskId's
// own "Depends on" would create a cycle, so the dropdown excludes them.
function templateDescendantIds(set, taskId){
  const result = new Set();
  let added = true;
  while(added){
    added = false;
    set.tasks.forEach(t => {
      if(!result.has(t.id) && (t.dependsOn===taskId || result.has(t.dependsOn))){
        result.add(t.id); added = true;
      }
    });
  }
  return result;
}
function templateDependsOnOptionsHtml(set, taskId, selectedId){
  // taskId is null for the "add new task" form — a task that doesn't exist yet can't
  // have any existing descendants, so nothing needs excluding in that case.
  const excluded = taskId ? templateDescendantIds(set, taskId) : new Set();
  const options = set.tasks.filter(t => t.id!==taskId && !excluded.has(t.id));
  return `<option value="">— None —</option>` + options.map(t=>`<option value="${t.id}" ${selectedId===t.id?'selected':''}>${t.name}</option>`).join('');
}

/* ---- Performance (Admin / Manager only — feeds incentive/increment review) ---- */
function memberPerformance(user){
  const all = allTasksScoped().filter(x => x.task.assignedTo===user.id);
  const total = all.length;
  const done = all.filter(x => SUCCESS_STATUSES.includes(x.task.status));
  const onTime = done.filter(x => x.task.actualDate && x.task.actualDate <= opDate(x.task));
  const late = done.filter(x => x.task.actualDate && x.task.actualDate > opDate(x.task));
  const overdueOpen = all.filter(x => taskStatusComputed(x.task)==='Overdue');
  const avgDelay = late.length ? (late.reduce((sum,x)=> sum + daysBetween(opDate(x.task), x.task.actualDate), 0) / late.length) : 0;
  const completionRate = total ? (done.length/total)*100 : 0;
  const onTimeRate = done.length ? (onTime.length/done.length)*100 : null;
  // Starting-point formula: weighted on-time rate + completion rate, penalised for tasks currently overdue.
  // Meant as one input for review conversations, not an automatic verdict — delays aren't always the person's fault
  // (late buyer approvals, mill delays, etc.), so pair this with a human look at remarks before using it for pay decisions.
  // Note: only Done/Approved count as a completion here — Rejected and N/A are excluded so they don't distort the score.
  const score = Math.max(0, Math.round(((onTimeRate ?? 100) * 0.6) + (completionRate * 0.4) - (overdueOpen.length * 3)));
  return {user, total, done: done.length, onTime: onTime.length, late: late.length, overdueOpen: overdueOpen.length, avgDelay: Math.round(avgDelay*10)/10, completionRate: Math.round(completionRate), onTimeRate: onTimeRate===null?null:Math.round(onTimeRate), score};
}

function buyerPerformance(buyer){
  const orders = scopedOrders().filter(o=>o.buyerId===buyer.id);
  const all = [];
  orders.forEach(o => o.tasks.forEach(t => all.push(t)));
  const done = all.filter(t=>SUCCESS_STATUSES.includes(t.status));
  const onTime = done.filter(t=>t.actualDate && t.actualDate<=opDate(t));
  const overdueOpen = all.filter(t=>taskStatusComputed(t)==='Overdue');
  const onTimeRate = done.length ? Math.round((onTime.length/done.length)*100) : null;
  const ragCounts = {red:0, amber:0, green:0};
  orders.forEach(o => ragCounts[orderRAG(o)]++);
  return {buyer, orders: orders.length, totalTasks: all.length, done: done.length, overdueOpen: overdueOpen.length, onTimeRate, ragCounts};
}

function performanceFiltersActive(){
  return performanceFilters.buyerId!=='all' || performanceFilters.memberId!=='all' || performanceFilters.dept!=='all';
}
// Picks the single most notable strength and weakness out of a candidate list —
// keeps each card to one clear headline of each rather than a wall of bullets.
function memberGapInsights(m){
  if(m.total===0) return {strength:null, weakness:null};
  const strengths = [];
  const weaknesses = [];
  if(m.onTimeRate!==null && m.onTimeRate>=90) strengths.push(`${m.onTimeRate}% on-time completion, well above target`);
  if(m.completionRate>=90) strengths.push(`High completion rate, ${m.done} of ${m.total} tasks done`);
  if(m.overdueOpen===0) strengths.push('No tasks currently overdue');
  if(m.overdueOpen>0) weaknesses.push(`${m.overdueOpen} task${m.overdueOpen>1?'s':''} currently overdue${m.avgDelay>0?`, averaging ${m.avgDelay}d late`:''}`);
  if(m.onTimeRate!==null && m.onTimeRate<60) weaknesses.push(`Only ${m.onTimeRate}% on-time completion`);
  if(m.completionRate<50) weaknesses.push(`Low completion rate (${m.completionRate}%)`);
  if(m.avgDelay>5) weaknesses.push(`Averaging ${m.avgDelay}d delay on late tasks`);
  return { strength: strengths[0]||null, weakness: weaknesses[0]||null };
}
function buyerGapInsights(b){
  if(b.totalTasks===0) return {strength:null, weakness:null};
  const strengths = [];
  const weaknesses = [];
  if(b.onTimeRate!==null && b.onTimeRate>=90) strengths.push(`${b.onTimeRate}% on-time completion across all orders`);
  if(b.ragCounts.green > (b.ragCounts.red+b.ragCounts.amber)) strengths.push(`Most orders on track (${b.ragCounts.green} of ${b.orders} green)`);
  if(b.overdueOpen===0) strengths.push('No tasks currently overdue');
  if(b.overdueOpen>0) weaknesses.push(`${b.overdueOpen} task${b.overdueOpen>1?'s':''} currently overdue across orders`);
  if(b.ragCounts.red>0) weaknesses.push(`${b.ragCounts.red} order${b.ragCounts.red>1?'s':''} at risk`);
  if(b.onTimeRate!==null && b.onTimeRate<60) weaknesses.push(`Only ${b.onTimeRate}% on-time completion`);
  return { strength: strengths[0]||null, weakness: weaknesses[0]||null };
}
// Renders one gap-analysis card — score bar against the 80-point target, plus
// the standout strength/weakness text from *GapInsights() above.
function gapCardHtml(name, sub, score, insights){
  const pct = Math.max(0, Math.min(100, score));
  const barColor = score>=80 ? 'var(--green)' : score>=50 ? 'var(--brass)' : 'var(--thread-red)';
  const badgeClass = score>=80?'done':score>=50?'progress':'overdue';
  const gapText = score>=80 ? 'At or above target' : `${80-score} point${80-score===1?'':'s'} below target`;
  return `<div class="panel" style="margin-bottom:12px;">
    <div class="flex-between" style="margin-bottom:10px;">
      <div>
        <div style="font-weight:600;font-family:'Space Grotesk',sans-serif;">${name}</div>
        <div style="font-size:13px;color:var(--muted);">${sub}</div>
      </div>
      <span class="badge ${badgeClass}">Score ${score}</span>
    </div>
    <div style="position:relative;height:8px;background:var(--canvas);border-radius:4px;margin-bottom:4px;">
      <div style="position:absolute;left:0;top:0;height:8px;width:${pct}%;background:${barColor};border-radius:4px;"></div>
      <div style="position:absolute;left:80%;top:-3px;width:2px;height:14px;background:var(--muted);"></div>
    </div>
    <div class="hint" style="margin:0 0 12px;">Target 80 · ${gapText}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
      <div>
        <div style="font-size:12px;font-weight:600;color:var(--green);margin-bottom:4px;">Strength</div>
        <div style="font-size:13px;color:var(--muted);">${insights.strength || 'Not enough data yet'}</div>
      </div>
      <div>
        <div style="font-size:12px;font-weight:600;color:${insights.weakness?'var(--thread-red)':'var(--muted)'};margin-bottom:4px;">${insights.weakness?'Weakness':'—'}</div>
        <div style="font-size:13px;color:var(--muted);">${insights.weakness || 'No major issues found'}</div>
      </div>
    </div>
  </div>`;
}

function performanceTier(score){
  if(score>=80) return {cls:'done', label:'Good'};
  if(score>=50) return {cls:'progress', label:'Medium'};
  return {cls:'overdue', label:'Low'};
}
function headsForBuyer(buyerId){
  const names = managersForBuyer(buyerId).map(m=>m.name);

function csvDownloadHref(rows){

function buildDigestText(u, tasks){

  );

function renderNotify(){
  const scopedMembers = scopedUsers().filter(u=>u.role==='member');

  // Dedicated 3-day alert for Merchandising — CCs the buyer's manager(s) automatically
  const merchAlerts = scopedMembers.filter(u => u.dept==='Merchandising').map(u => {
    const tasks = allTasksScoped().filter(x => x.task.assignedTo===u.id
      && isOpenTask(x.task)
      && daysBetween(today(), opDate(x.task)) <= 3
    ).sort((a,b)=> opDate(a.task)<opDate(b.task)?-1:1);
    return {u, tasks};
  }).filter(x => x.tasks.length>0);

  const merchAlertHtml = merchAlerts.map(({u,tasks}) => {
    const overdue = tasks.filter(x=>taskStatusComputed(x.task)==='Overdue');
    const taskBuyerIds = [...new Set(tasks.map(x=>x.order.buyerId))];
    const managers = [...new Map(taskBuyerIds.flatMap(bid=>managersForBuyer(bid)).map(m=>[m.id,m])).values()];
    const managerEmails = managers.map(m=>m.email).filter(Boolean);
    const subject = `⚠ 3-day alert — ${tasks.length} task${tasks.length!==1?'s':''} due soon (${u.name})`;
    const lines = tasks.map(x => `${fmtDate(opDate(x.task))} — ${x.task.name} (${x.order.styleNo}, ${buyerName(x.order.buyerId)})${taskStatusComputed(x.task)==='Overdue' ? ' [OVERDUE]' : ''}`);
    const body = `Hi ${u.name.split(' ')[0]},\n\nThese tasks are due within 3 days or already overdue:\n\n${lines.join('\n')}\n\nYour manager is CC'd on this alert.`;
    let mailtoHref = `mailto:${encodeURIComponent(u.email||'')}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    if(managerEmails.length) mailtoHref += `&cc=${encodeURIComponent(managerEmails.join(','))}`;

    return `<div class="email-preview" style="border-color:var(--thread-red-dim);">
      <div class="to">To: ${u.email || '(no email on file)'} — ${u.name} (${buyerNamesDisplay(u)})${managerEmails.length ? ` · CC: ${managers.map(m=>m.name).join(', ')}` : ' · <span style="color:var(--thread-red);">no manager on file for this buyer to CC</span>'}</div>
      <div class="subj">${subject}</div>
      <ul>
        ${tasks.map(x => `<li><strong>${fmtDate(opDate(x.task))}</strong> — ${x.task.name} (${x.order.styleNo}, ${buyerName(x.order.buyerId)})${taskStatusComputed(x.task)==='Overdue' ? ' <span style="color:var(--thread-red);">· overdue</span>' : ''}</li>`).join('')}
      </ul>
      <div class="row-actions">
        <a class="btn small ${u.email?'':'ghost'}" ${u.email ? `href="${mailtoHref}"` : 'aria-disabled="true" style="opacity:.5;pointer-events:none;"'}>Send alert (CC manager)</a>
      </div>
    </div>`;

/* ---- Consumption Calculator ----
   Same "YY calculation" formula merchandising already uses on paper/Excel for fabric
   consumption per garment piece, moved in-system as a live, reusable tool instead of
   a spreadsheet someone has to keep re-opening and re-typing into:
     1. Marker length (yds) = Yards input + (Inches input + extra allowance) / 36
     2. Yds/Pc  = Marker length (yds) / No. of pieces in the marker
     3. Mtr/Pc  = Yds/Pc × 0.9144
     4. Kg/Pc   = (Mtr/Pc × Fabric width (inches) × GSM) / 39.37 / 1000
     5. Kg/Pc with wastage% = Kg/Pc × (1 + wastage/100)
     6. Total fabric required = Kg/Pc with wastage × Order qty (when a qty is given)
   Every step mirrors the manual sheet exactly, so results are checkable line-by-line
   against what merchandising already trusts — this isn't a different formula, just
   the same one made instant, reusable across styles, and exportable as a PDF instead
   of a one-off Excel calculation. */
function calcFabricConsumption(inputs){
  const { width, markerYds, markerIn, extraIn, gsm, pcsInMarker, wastagePct, orderQty } = inputs;
  // Width/marker-yards/GSM/pieces can never legitimately be zero — treat as missing.
  // markerIn/extraIn CAN legitimately be exactly 0 (a whole-yard marker length, or no
  // extra allowance) — only reject those if truly missing or negative, not zero, since
  // Automatic mode (CAD-parsed markers) always passes extraIn 0 deliberately.
  if([width, markerYds, gsm, pcsInMarker].some(v => v===null || isNaN(v) || v<=0)) return null;
  if([markerIn, extraIn].some(v => v===null || isNaN(v) || v<0)) return null;
  const markerTotalYds = markerYds + ((markerIn + extraIn) / 36);
  const ydsPerPc = markerTotalYds / pcsInMarker;
  const mtrPerPc = ydsPerPc * 0.9144;
  const kgPerPc = ((mtrPerPc * width * gsm) / 39.37) / 1000;
  const wastage = (wastagePct===null || isNaN(wastagePct)) ? 0 : wastagePct;
  const kgPerPcWithWastage = kgPerPc * (1 + wastage/100);
  const totalKg = (orderQty!==null && !isNaN(orderQty) && orderQty>0) ? kgPerPcWithWastage * orderQty : null;
  return { markerTotalYds, ydsPerPc, mtrPerPc, kgPerPc, wastage, kgPerPcWithWastage, orderQty, totalKg };
}
function readConsumptionInputs(){
  const num = id => { const el = document.getElementById(id); if(!el || el.value==='') return null; const v = parseFloat(el.value); return isNaN(v) ? null : v; };
  return {
    width: num('consWidth'), markerYds: num('consMarkerYds'), markerIn: num('consMarkerIn'),
    extraIn: num('consExtra'), gsm: num('consGsm'), pcsInMarker: num('consPcsInMarker'),
    wastagePct: num('consWastagePct'), orderQty: num('consOrderQty'),
  };
}
function fmtKg(n){ return n===null || n===undefined ? '—' : n.toFixed(4); }
// A fixed 0–5% wastage sweep off the same no-wastage base figure, shown alongside the
// single wastage% the user actually typed — so the whole range is visible at a glance
// instead of having to retype the wastage field five times to compare. Used by both
// the kg-based (Manual/Automatic-yard) and meters-based (Automatic-metric) results.
function wastageSweepTableHtml(basePerPc, unit){
  const rows = [0,1,2,3,4,5].map(pct =>
    `<tr><td>${pct}%</td><td class="mono">${(basePerPc*(1+pct/100)).toFixed(4)} ${unit}</td></tr>`
  ).join('');
  return `
    <div class="hint" style="margin:14px 0 6px;font-weight:600;color:var(--ink-soft);">Consumption per piece at each wastage %</div>
    <table>
      <thead><tr><th>Wastage</th><th>Consumption / Pc</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}
// Same 0–5% sweep as wastageSweepTableHtml(), as pdfTable() rows instead of HTML —
// used by every "Export PDF" button so the wastage comparison that's on screen is
// also in the exported file, not just the live view.
function wastageSweepPdfRows(basePerPc, unit){
  return [0,1,2,3,4,5].map(pct => [pct+'%', (basePerPc*(1+pct/100)).toFixed(4)+' '+unit]);
}
// Shared by both Manual and Automatic mode so the result presentation — and the
// exact wording of each formula step — never drifts between the two.
function consumptionResultHtml(r){
  return `
    <div class="kpi-grid" style="margin-bottom:14px;">

    </div>
    <table>

        <tr><td>Kg / Pc (with wastage)</td><td class="mono">Kg/Pc × (1 + ${r.wastage}%)</td><td class="mono">${r.kgPerPcWithWastage.toFixed(4)} kg</td></tr>

/* ---- Automatic mode — reads Length/Width/Sets straight out of an uploaded CAD marker
   PDF instead of someone retyping them off a printout. The marker PDFs this reads
   export a plain-text summary line at the bottom of the page in one of two forms:
     Length:8yard6.16inch(8.17yard); Width:2yard0inch(72inch); ... Sets:25,...;
     Length:0m60.34cm(0.6m);         Width:1m2cm(102cm);       ... Sets:22,...;
   i.e. yard/inch markers or meter/cm markers — both seen in practice. Either way, the
   parenthesised figure is already the fully-combined decimal (yards, or meters) for
   Length, and the fully-combined decimal (inches, or cm) for Width, so no manual
   whole+fraction arithmetic is needed — just pull those two numbers out.
   Deliberately regex-based rather than routed through an LLM: the source data is
   already exact, machine-generated text (not a photo or handwriting), so a precise text
   match is strictly more reliable than a probabilistic reading — and this is a number
   that drives real fabric purchasing, where "usually right" isn't good enough. */
function parseMarkerPdfText(text){
  const clean = text.replace(/\s+/g, ' ');
  const styleMatch = clean.match(/Style\s*Name\s*:\s*([^;]+);/i);
  const sizeMatch = clean.match(/\bSize\s*:\s*([^;]+);/i);
  const materialMatch = clean.match(/Material\s*:\s*([^;]+);/i);
  const setsMatch = clean.match(/Sets\s*:\s*(\d+)/i);
  const effMatch = clean.match(/Efficiency\s*:\s*([\d.]+)\s*%/i);

  let unitSystem = null, lengthBig = null, widthSmall = null;
  const lenYd = clean.match(/Length\s*:\s*[\d.]+\s*yard\s*[\d.]+\s*inch\s*\(\s*([\d.]+)\s*yard\s*\)/i);
  const widYd = clean.match(/Width\s*:\s*[\d.]+\s*yard\s*[\d.]+\s*inch\s*\(\s*([\d.]+)\s*inch\s*\)/i);
  if(lenYd && widYd){
    unitSystem = 'yard';
    lengthBig = parseFloat(lenYd[1]);
    widthSmall = parseFloat(widYd[1]);
  }else{
    const lenM = clean.match(/Length\s*:\s*[\d.]+\s*m\s*[\d.]+\s*cm\s*\(\s*([\d.]+)\s*m\s*\)/i);
    const widM = clean.match(/Width\s*:\s*[\d.]+\s*m\s*[\d.]+\s*cm\s*\(\s*([\d.]+)\s*cm\s*\)/i);
    if(lenM && widM){
      unitSystem = 'metric';
      lengthBig = parseFloat(lenM[1]);
      widthSmall = parseFloat(widM[1]);
    }
  }
  if(!unitSystem || !setsMatch) return null;

  return {
    styleName: styleMatch ? styleMatch[1].trim() : '',
    sizes: sizeMatch ? sizeMatch[1].trim() : '',
    material: materialMatch ? materialMatch[1].trim() : '',
    sets: parseInt(setsMatch[1], 10),
    efficiency: effMatch ? parseFloat(effMatch[1]) : null,
    unitSystem, lengthBig, widthSmall,
  };
}
// Normalizes a parsed marker (whichever unit system it came in) onto the exact same
// (yards, inches) basis calcFabricConsumption() already expects, then calls that same
// function unchanged — Automatic mode is a different INPUT PATH, not different math.
// Per spec: no extra allowance on the length side here (the CAD length is used as-is,
// unlike Manual mode's marker-length extra) — only the width gets a user-editable
// extra, because a marker's reported width is the CUTTABLE width, and real fabric
// rolls run wider than that (selvage/finishing you can't cut from), so the full
// fabric width used for the weight calc is the marker's width plus that allowance.
function calcAutomaticConsumption(marker, gsm, widthExtraIn, wastagePct, orderQty){
  if(!marker) return null;
  const markerYds = marker.unitSystem==='yard' ? marker.lengthBig : marker.lengthBig * 1.0936133;
  const widthInchesCuttable = marker.unitSystem==='yard' ? marker.widthSmall : marker.widthSmall / 2.54;
  const extra = (widthExtraIn===null || isNaN(widthExtraIn)) ? 0 : widthExtraIn;
  return calcFabricConsumption({
    width: widthInchesCuttable + extra, markerYds, markerIn: 0, extraIn: 0,
    gsm, pcsInMarker: marker.sets, wastagePct, orderQty,
  });
}
// Meter/cm markers get their own rule, distinct from the yard/kg path above: no GSM
// at all — consumption is the marker LENGTH per piece (in meters), not a weight, since
// meter-based materials (fusing/interlining, trims) are bought by running length at a
// given width, not by kg. Both extras here are fixed constants per spec, not editable:
// +5cm on the marker length before dividing by Sets, +4cm on the cuttable width to get
// the fabric width actually needed (shown for reference — it doesn't feed the length
// math, since there's no weight term for it to multiply into).
const METRIC_LENGTH_EXTRA_M = 0.05; // 5cm, constant
const METRIC_WIDTH_EXTRA_CM = 4; // constant
function calcMetricConsumption(marker, wastagePct, orderQty){
  if(!marker || marker.unitSystem!=='metric') return null;
  if(marker.lengthBig===null || isNaN(marker.lengthBig) || marker.lengthBig<=0) return null;
  if(marker.widthSmall===null || isNaN(marker.widthSmall) || marker.widthSmall<=0) return null;
  if(!marker.sets || marker.sets<=0) return null;
  const totalLengthM = marker.lengthBig + METRIC_LENGTH_EXTRA_M;
  const lengthPerPcM = totalLengthM / marker.sets;
  const fullWidthCm = marker.widthSmall + METRIC_WIDTH_EXTRA_CM;
  const wastage = (wastagePct===null || isNaN(wastagePct)) ? 0 : wastagePct;
  const lengthPerPcWithWastageM = lengthPerPcM * (1 + wastage/100);
  const totalM = (orderQty!==null && !isNaN(orderQty) && orderQty>0) ? lengthPerPcWithWastageM * orderQty : null;
  return { totalLengthM, lengthPerPcM, fullWidthCm, wastage, lengthPerPcWithWastageM, orderQty, totalM };
}
function metricConsumptionResultHtml(r){
  if(!r) return emptyState('chart', 'Could not calculate — check the marker data.');
  return `
    <div class="kpi-grid" style="margin-bottom:14px;">
      <div class="stat"><div class="num">${r.lengthPerPcM.toFixed(4)}</div><div class="lbl">Meters / Pc (no wastage)</div></div>
      <div class="stat alert"><div class="num">${r.lengthPerPcWithWastageM.toFixed(4)}</div><div class="lbl">Meters / Pc (with ${r.wastage}% wastage)</div></div>
      ${r.totalM!==null ? `<div class="stat"><div class="num">${r.totalM.toFixed(2)}</div><div class="lbl">Total Meters for ${r.orderQty} pcs</div></div>` : ''}
    </div>
    <table>
      <thead><tr><th>Step</th><th>Formula</th><th>Result</th></tr></thead>
      <tbody>
        <tr><td>Marker length (total)</td><td class="mono">Length + 5cm (constant)</td><td class="mono">${r.totalLengthM.toFixed(4)} m</td></tr>
        <tr><td>Meters / Pc</td><td class="mono">Marker length ÷ Sets</td><td class="mono">${r.lengthPerPcM.toFixed(4)} m</td></tr>
        <tr><td>Meters / Pc (with wastage)</td><td class="mono">Meters/Pc × (1 + ${r.wastage}%)</td><td class="mono">${r.lengthPerPcWithWastageM.toFixed(4)} m</td></tr>
        ${r.totalM!==null ? `<tr><td>Total for order</td><td class="mono">Meters/Pc (with wastage) × ${r.orderQty} pcs</td><td class="mono">${r.totalM.toFixed(2)} m</td></tr>` : ''}
        <tr><td>Required fabric width</td><td class="mono">Cuttable width + 4cm (constant)</td><td class="mono">${r.fullWidthCm.toFixed(2)} cm</td></tr>
      </tbody>
    </table>
    <p class="hint" style="margin-top:8px;">No GSM needed for a meter-based marker — consumption is calculated directly by length, at the required fabric width above.</p>
    ${wastageSweepTableHtml(r.lengthPerPcM, 'm')}`;
}
function readAutomaticInputs(){
  const num = id => { const el = document.getElementById(id); if(!el || el.value==='') return null; const v = parseFloat(el.value); return isNaN(v) ? null : v; };
  return { gsm: num('consAutoGsm'), widthExtraIn: num('consAutoWidthExtra'), wastagePct: num('consAutoWastagePct'), orderQty: num('consAutoOrderQty') };
}

  // BOM Balance/% are just derived from Required vs Received qty — update them live as you
  // type in either field, using whatever's currently on screen, so you see the real number
  // immediately instead of a stale 0%/full-balance until you click Save.
  function liveUpdateBomRow(inp){
    const row = inp.closest('tr');
    if(!row) return;
    const reqInput = row.querySelector('.bom-qty-input');
    const recvInput = row.querySelector('.bom-receivedqty-input');
    const balCell = row.querySelector('.bom-balance-display');
    const pctCell = row.querySelector('.bom-pct-display');
    if(!reqInput || !recvInput || !balCell || !pctCell) return;
    const req = parseFloat(reqInput.value);
    const recv = parseFloat(recvInput.value);
    if(isNaN(req) || req<=0){ balCell.value = '—'; pctCell.outerHTML = qtyPctChipHtml(null); return; }
    const recvSafe = isNaN(recv) ? 0 : recv;
    balCell.value = Math.max(0, req - recvSafe);
    pctCell.outerHTML = qtyPctChipHtml(Math.round((recvSafe/req)*100));
  }
  document.querySelectorAll('.bom-qty-input, .bom-receivedqty-input').forEach(inp => {

  document.querySelectorAll('.excel-cell').forEach(inp => {

  // Task rows (My Tasks + order detail) no longer auto-save on every field change —

  document.querySelectorAll('[data-save-task-row]').forEach(btn => {
    btn.addEventListener('click', () => {
      const order = DATA.orders.find(o=>o.id===btn.dataset.order);

        if(newRemarks.trim() && newRemarks !== task.remarks){

  document.querySelectorAll('[data-save-pcd]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const orderId = btn.dataset.savePcd;
      const order = DATA.orders.find(o=>o.id===orderId);
      const newPcd = document.getElementById('editPcdInput_'+orderId).value;
      if(!newPcd){ showToast('Pick a date'); return; }
      if(newPcd === order.pcd){ editingPcdOrderId = null; renderTabContent(); return; }
      const delta = daysBetween(order.pcd, newPcd);
      const openTasks = order.tasks.filter(isOpenTask);
      const manuallySetOpen = openTasks.filter(t => t.expectedDateManuallySet);

      if(!confirm(`Change PCD from ${fmtDate(order.pcd)} to ${fmtDate(newPcd)}?\n\nSystem Estimated Dates for all ${openTasks.length} not-yet-completed tasks will be recalculated from the template. Expected Dates that are still following the system plan will move too. Completed/resolved tasks keep their original dates.`)) return;

      let shiftManualToo = false;
      if(manuallySetOpen.length > 0){
        shiftManualToo = confirm(`${manuallySetOpen.length} task${manuallySetOpen.length!==1?'s have':' has'} an Expected Date your team already updated manually, different from the system plan.\n\nOK = shift those by the same amount too.\nCancel = leave them exactly as your team set them.`);
      }

      order.tasks.forEach(t => {
        if(!isOpenTask(t)) return;
        // System Estimated recalculates properly from the template offset when we have
        // one (TNA tasks); BOM/material items fall back to a plain shift since they don't
        // have a template-driven offset the same way.
        t.plannedDate = (t.offsetDays !== undefined && t.offsetDays !== null)
          ? addDays(newPcd, -t.offsetDays)
          : addDays(t.plannedDate, delta);
        if(!t.expectedDateManuallySet){
          t.expectedDate = t.plannedDate; // still following the default plan — keep it in sync
        } else if(shiftManualToo){
          t.expectedDate = addDays(t.expectedDate, delta); // explicitly opted in to move custom dates too
        }
        // manually-set and not opted in: Expected Date is left completely untouched
      });
      order.pcd = newPcd;
      editingPcdOrderId = null;
      renderTabContent();
      showToast('PCD updated');
      saveData();

      e.target.value = '';
      if(!text) return;
      const rows = parseTemplatePaste(text);
      if(rows.length===0){ showToast('No usable rows found in that file'); return; }
      if(setId === 'new'){
        const name = document.getElementById('newSetName').value.trim();
        if(!name){ showToast('Enter a template name first'); return; }
        templatePastePreview = {setId: null, name, rows};
      } else {
        templatePastePreview = {setId, rows};
      }
      renderTabContent();
    });
  });
  // Bulk paste-from-Excel to add tasks into an existing set
  document.querySelectorAll('[data-preview-tpl-paste]').forEach(btn => {
    btn.addEventListener('click', () => {
      const setId = btn.dataset.previewTplPaste;
      const text = gridDataToTsv('tpl_'+setId);
      const rows = parseTemplatePaste(text);
      if(rows.length===0){ showToast('Paste your task rows into the grid first'); return; }
      templatePastePreview = {setId, rows};
      renderTabContent();
    });
  });
  document.querySelectorAll('[data-cancel-tpl-paste]').forEach(btn => {
    btn.addEventListener('click', () => { templatePastePreview = null; renderTabContent(); });
  });
  // Preview grid stays editable before confirming
  document.querySelectorAll('.tpl-preview-name').forEach(inp => inp.addEventListener('change', e => {
    const r = templatePastePreview.rows[e.target.dataset.idx]; r.name = e.target.value.trim();
    r.error = !r.name ? 'Missing task name' : (r.offset===null ? 'Missing/invalid days before PCD' : '');
  }));
  document.querySelectorAll('.tpl-preview-dept').forEach(sel => sel.addEventListener('change', e => {
    templatePastePreview.rows[e.target.dataset.idx].dept = e.target.value;
  }));
  document.querySelectorAll('.tpl-preview-offset').forEach(inp => inp.addEventListener('change', e => {
    const r = templatePastePreview.rows[e.target.dataset.idx];
    const v = parseInt(e.target.value, 10);
    r.offset = isNaN(v) ? null : v;
    r.error = !r.name ? 'Missing task name' : (r.offset===null ? 'Missing/invalid days before PCD' : '');
  }));
  document.querySelectorAll('[data-import-tpl-paste]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const target = btn.dataset.importTplPaste;
      const validRows = templatePastePreview.rows.filter(r=>!r.error);
      const newTasks = validRows.map(r => ({id: uid('tpl'), name:r.name, dept:r.dept, offset:r.offset, dependsOn: null}));
      if(target === 'new'){
        const newSet = {id: uid('tplset'), name: templatePastePreview.name, tasks: newTasks};
        DATA.templateSets.push(newSet);
        currentSetExpanded[newSet.id] = true;
        clearGridData('tpl_new');
      } else {
        const set = DATA.templateSets.find(s=>s.id===target);
        set.tasks.push(...newTasks);
        clearGridData('tpl_'+target);
      }
      templatePastePreview = null;
      renderTabContent(); showToast(`Added ${newTasks.length} task${newTasks.length!==1?'s':''}`); saveData();
    });
  });
  document.querySelectorAll('[data-add-template-to-set]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const setId = btn.dataset.addTemplateToSet;
      const set = DATA.templateSets.find(s=>s.id===setId);
      const name = document.getElementById('newTplName_'+setId).value.trim();
      const dept = document.getElementById('newTplDept_'+setId).value;
      const offset = parseInt(document.getElementById('newTplOffset_'+setId).value, 10);
      const effortRaw = document.getElementById('newTplEffort_'+setId).value;
      const effort = effortRaw==='' ? 1 : parseFloat(effortRaw);
      const dependsOnEl = document.getElementById('newTplDependsOn_'+setId);
      const dependsOn = (dependsOnEl && dependsOnEl.value) ? dependsOnEl.value : null;
      if(!name || isNaN(offset)){ showToast('Enter a task name and offset'); return; }
      if(isNaN(effort) || effort<0){ showToast('Enter a valid effort (person-days)'); return; }
      set.tasks.push({id: uid('tpl'), name, dept, offset, effort, dependsOn});
      renderTabContent(); saveData();
    });
  });
  document.querySelectorAll('[data-delete-template]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const set = DATA.templateSets.find(s=>s.id===btn.dataset.set);
      const removedId = btn.dataset.deleteTemplate;
      set.tasks = set.tasks.filter(t=>t.id!==removedId);
      // Anything that depended on the task just removed would otherwise point at a
      // task id that no longer exists in this set.
      set.tasks.forEach(t => { if(t.dependsOn===removedId) t.dependsOn = null; });
      renderTabContent(); saveData();
    });
  });
}

// Shown instead of the app when loadData() couldn't confirm what's actually saved
// (see DATA_LOAD_FAILED). Deliberately not the normal app shell — nothing here is
// editable, so there's no way to accidentally trigger a save that would overwrite
// real data with the placeholder defaults loadData() fell back to.
function renderLoadError(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="panel" style="border-color:var(--thread-red-dim);max-width:560px;margin:60px auto;">
      <h2 style="color:var(--thread-red);">Couldn't load your data</h2>
      <p class="desc">TNA couldn't confirm what's actually saved — the shared backend didn't respond, or the saved data looked corrupted. Nothing has been changed or saved. Check your connection and retry rather than continuing, since continuing here would risk overwriting real data with a blank slate.</p>
      <div class="row-actions" style="margin-top:14px;">
        <button class="btn" id="retryLoadBtn">Retry</button>
      </div>
    </div>`;
  const retryBtn = app.querySelector('#retryLoadBtn');
  if(retryBtn) retryBtn.addEventListener('click', async () => {
    app.innerHTML = `<div class="loading" id="loadingMsg">Retrying…</div>`;
    await loadData();
    if(DATA_LOAD_FAILED){ renderLoadError(); return; }
    if(getActiveUser()) applyPendingDeepLink();
    render();
  });
}

/* ---------------- Init ---------------- */
(async function init(){
  await loadData();
  if(DATA_LOAD_FAILED){ renderLoadError(); return; }
  if(getActiveUser()) applyPendingDeepLink();
  render();
})();
</script>
