<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMBEE — TNA Merchandising Time & Action System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#17233A;
    --ink-soft:#2B3A55;
    --canvas:#EDEAE0;
    --canvas-panel:#FBF9F4;
    --thread-red:#C1443C;
    --thread-red-dim:#E7C3BF;
    --brass:#B8862E;
    --brass-soft:#E9D5A8;
    --green:#3E7A4E;
    --green-soft:#D6E6D9;
    --line:#D8D3C4;
    --muted:#6B7385;
    --radius:10px;
    --shadow:0 1px 2px rgba(23,35,58,0.06), 0 6px 20px rgba(23,35,58,0.05);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background-color:var(--canvas);
    background-image: radial-gradient(circle, rgba(23,35,58,0.07) 1px, transparent 1px);
    background-size: 22px 22px;
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:1720px;margin:0 auto;padding:28px 32px 80px;}

  .header{
    background-color:var(--ink);
    background-image:
      linear-gradient(135deg, rgba(255,255,255,0.035) 25%, transparent 25%, transparent 50%, rgba(255,255,255,0.035) 50%, rgba(255,255,255,0.035) 75%, transparent 75%, transparent);
    background-size: 14px 14px;
    color:var(--canvas-panel);
    border-radius:14px;
    padding:26px 28px 22px;
    margin-bottom:22px;
    position:relative;
    overflow:hidden;
  }
  .header-top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:14px;}
  .brand-row{display:flex;align-items:center;gap:16px;}
  .brand-logo-badge{background:#FBF9F4;border-radius:10px;padding:9px 16px;display:flex;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,0.18);flex-shrink:0;}
  .brand-logo-badge img{display:block;height:34px;width:auto;}
  .brand-divider{width:1px;align-self:stretch;background:#3B4A68;}
  .header h1{font-family:'Space Grotesk', sans-serif;font-size:22px;margin:0 0 2px;letter-spacing:0.2px;}
  .header .sub{color:#AEB9CF;font-size:13px;font-family:'IBM Plex Mono',monospace;}
  .whoami{background:#22314C;border:1px solid #3B4A68;border-radius:9px;padding:10px 14px;text-align:right;min-width:220px;}
  .whoami .label{font-size:10.5px;color:#8B97AF;text-transform:uppercase;letter-spacing:0.4px;}
  .whoami .name{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13.5px;margin:2px 0 2px;}
  .whoami .role{font-size:11.5px;color:#AEB9CF;margin-bottom:8px;}
  .whoami a.logout{color:var(--thread-red-dim);font-size:12px;font-family:'Space Grotesk',sans-serif;font-weight:600;cursor:pointer;text-decoration:none;}
  .whoami a.logout:hover{text-decoration:underline;}
  .ruler{margin-top:18px;display:flex;align-items:flex-end;gap:0;height:34px;border-bottom:2px solid #3B4A68;position:relative;}
  .ruler .tick{flex:1;border-left:1px solid #3B4A68;height:10px;align-self:flex-end;}
  .ruler .tick.major{height:18px;border-left:1px solid #5A6B8C;}
  .ruler-labels{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:11px;color:#8B97AF;margin-top:6px;}

  .tabs{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap;}
  .tab{font-family:'Space Grotesk',sans-serif;font-size:13.5px;font-weight:600;padding:9px 16px;border-radius:8px;cursor:pointer;background:transparent;color:var(--ink-soft);border:1px solid transparent;}
  .tab:hover{background:#E2DECF;}
  .tab.active{background:var(--ink);color:var(--canvas-panel);}

  .panel{
    background-color:var(--canvas-panel);
    background-image: linear-gradient(rgba(23,35,58,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(23,35,58,0.02) 1px, transparent 1px);
    background-size: 16px 16px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px;
    margin-bottom:18px;
    box-shadow:var(--shadow);
  }
  .panel h2{font-family:'Space Grotesk',sans-serif;font-size:16px;margin:0 0 4px;}
  .panel .desc{color:var(--muted);font-size:13px;margin:0 0 16px;}

  .grid-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:14px;}
  label{font-size:12px;font-weight:600;color:var(--ink-soft);display:block;margin-bottom:4px;}
  input, select, textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;font-family:'IBM Plex Sans',sans-serif;font-size:13.5px;background:#fff;color:var(--ink);}
  input:focus, select:focus, textarea:focus{outline:2px solid var(--brass-soft); border-color:var(--brass);}
  .field{margin-bottom:0;}

  button.btn{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;padding:9px 16px;border-radius:7px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;transition:transform .12s ease, background .15s ease, border-color .15s ease;}
  button.btn:hover{background:var(--ink-soft);}
  button.btn:active:not(:disabled){transform:scale(0.96);}
  button.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);}
  button.btn.ghost:hover{border-color:var(--ink);}
  button.btn.danger{background:transparent;color:var(--thread-red);border:1px solid var(--thread-red-dim);}
  button.btn.danger:hover{background:var(--thread-red-dim);}
  button.btn.small{padding:5px 10px;font-size:12px;}
  button.btn:disabled{opacity:.45;cursor:not-allowed;}

  /* ---- Motion — kept small and purposeful: feedback on actions, not decoration ---- */
  @keyframes tabFadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .tab-fade-in{animation:tabFadeIn .28s ease;}
  @keyframes badgePop{0%{transform:scale(0.55);}55%{transform:scale(1.18);}100%{transform:scale(1);}}
  .badge-pop{display:inline-block;animation:badgePop .45s cubic-bezier(.34,1.56,.64,1);}
  @media (prefers-reduced-motion: reduce){
    .tab-fade-in{animation:none;}
    .badge-pop{animation:none;}
    button.btn{transition:none;}
  }

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-family:'Space Grotesk',sans-serif;font-size:11.5px;text-transform:uppercase;letter-spacing:0.4px;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
  td{padding:9px 10px;border-bottom:1px solid #EFEBE0;vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .mono{font-family:'IBM Plex Mono',monospace;font-size:12.5px;}

  .badge{display:inline-block;font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;}
  .badge.pending{background:#EDEAE0;color:var(--ink-soft);}
  .badge.progress{background:var(--brass-soft);color:#7A5A16;}
  .badge.done{background:var(--green-soft);color:var(--green);}
  .badge.overdue{background:var(--thread-red-dim);color:var(--thread-red);}
  .dept-tag{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:5px;font-family:'Space Grotesk',sans-serif;}
  .dept-Merchandising{background:#E4E9F6;color:#33508C;}
  .dept-Purchase{background:#F6E9DA;color:#8C5C1F;}
  .dept-Store{background:#E6EDE1;color:#4C6E2E;}
  .dept-Shipping{background:#F3E1E5;color:#9B3556;}
  .dept-PPC{background:#EAE3F3;color:#5C3D8C;}
  .role-tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:5px;font-family:'Space Grotesk',sans-serif;text-transform:uppercase;letter-spacing:0.3px;}
  .avatar{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-family:'Space Grotesk',sans-serif;font-weight:700;color:#fff;flex-shrink:0;overflow:hidden;background:var(--ink-soft);vertical-align:middle;}
  .avatar img{width:100%;height:100%;object-fit:cover;}
  .avatar-sm{width:26px;height:26px;font-size:10.5px;}
  .avatar-md{width:38px;height:38px;font-size:13px;}
  .avatar-lg{width:56px;height:56px;font-size:18px;}
  .avatar-upload-label{cursor:pointer;}
  .role-admin{background:#17233A;color:#fff;}
  .role-manager{background:var(--brass-soft);color:#7A5A16;}
  .role-member{background:#EDEAE0;color:var(--ink-soft);}

  .order-card{border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px;background:#fff;}
  .order-card-head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:6px;}
  .order-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;}
  .order-meta{color:var(--muted);font-size:12.5px;font-family:'IBM Plex Mono',monospace;}
  .pcd-pill{background:var(--ink);color:#fff;font-family:'IBM Plex Mono',monospace;font-size:12px;padding:4px 10px;border-radius:6px;white-space:nowrap;}

  .empty{text-align:center;padding:40px 20px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;font-size:13.5px;display:flex;flex-direction:column;align-items:center;gap:10px;}
  .empty svg{opacity:0.45;}
  .row-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .hint{font-size:12px;color:var(--muted);margin-top:6px;}
  .divider{height:1px;background:var(--line);margin:16px 0;}
  .flex-between{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
  .stat-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:18px;}
  .stat{background:var(--canvas-panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow);}
  .stat .num{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;}
  .stat .lbl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.4px;margin-top:2px;}
  .stat.alert .num{color:var(--thread-red);}
  select.status-select{width:auto;min-width:130px;}
  input.remarks-input{min-width:160px;}
  td.readonly-cell{color:var(--muted);background:#F7F5EE;}
  .email-preview{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:10px;}
  .email-preview .to{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);}
  .email-preview .subj{font-weight:600;margin:4px 0 8px;}
  .email-preview li{margin-bottom:3px;font-size:13px;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;font-family:'Space Grotesk',sans-serif;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;z-index:999;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}
  .loading{padding:60px 20px;text-align:center;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
  .lock-note{background:#F6E9DA;border:1px solid var(--brass-soft);color:#7A5A16;border-radius:8px;padding:10px 14px;font-size:12.5px;margin-bottom:16px;}
  .gate{max-width:440px;margin:60px auto;text-align:center;}
  .gate-logo{display:flex;justify-content:center;margin-bottom:22px;}
  .gate-logo img{height:44px;width:auto;filter:drop-shadow(0 2px 6px rgba(23,35,58,0.15));}
  .login-hero{
    position:fixed;inset:0;overflow-y:auto;
    background-color:var(--ink);
    background-image:
      radial-gradient(circle at 12% 18%, rgba(184,134,46,0.22), transparent 45%),
      radial-gradient(circle at 88% 82%, rgba(184,134,46,0.16), transparent 50%),
      linear-gradient(135deg, rgba(255,255,255,0.035) 25%, transparent 25%, transparent 50%, rgba(255,255,255,0.035) 50%, rgba(255,255,255,0.035) 75%, transparent 75%, transparent);
    background-size: auto, auto, 14px 14px;
    z-index:0;
  }
  .login-hero .gate{position:relative;z-index:1;}
  .login-hero .gate-logo img{filter:drop-shadow(0 2px 10px rgba(0,0,0,0.5));}
  .gate .panel{text-align:left;background-color:var(--canvas-panel);background-image:linear-gradient(rgba(23,35,58,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(23,35,58,0.03) 1px, transparent 1px);background-size:14px 14px;border-top:3px solid var(--brass);}
  .checkbox-row{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13.5px;}
  .checkbox-row input{width:auto;}
  .checkbox-list{border:1px solid var(--line);border-radius:7px;padding:6px 12px;background:#fff;max-height:160px;overflow-y:auto;}

  /* Excel-like editable grid (BOM items, template bulk paste) */
  .xgrid{border:1px solid var(--line);border-radius:8px;overflow:auto;background:#fff;}
  .xgrid table{border-collapse:collapse;width:100%;min-width:720px;}
  .xgrid th{background:#F3EFE3;position:sticky;top:0;font-family:'Space Grotesk',sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:0.3px;color:var(--muted);padding:8px 6px;border:1px solid var(--line);text-align:left;white-space:nowrap;}
  .xgrid td{border:1px solid var(--line);padding:0;}
  .xgrid td input{border:none;border-radius:0;padding:7px 8px;font-size:13px;width:100%;background:transparent;}
  .xgrid td input:focus{outline:2px solid var(--brass);outline-offset:-2px;position:relative;z-index:1;background:#fffdf5;}
  .xgrid td.readonly{background:#F7F5EE;color:var(--muted);}
  .xgrid td.readonly input{color:var(--muted);}
  .xgrid tr:nth-child(even) td{background:#FBFAF6;}
  .xgrid tr:nth-child(even) td.readonly{background:#F2F0E8;}

  /* A genuine spreadsheet-style grid — column letters, row numbers, sticky headers —
     for pasting straight from Excel the way it actually looks, not a plain text box. */
  .excel-grid-wrap{border:1px solid var(--line);border-radius:8px;overflow:auto;background:#fff;max-height:380px;}
  .excel-grid{border-collapse:collapse;}
  .excel-grid th{background:#EDEAE0;border:1px solid var(--line);font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--muted);text-align:center;height:24px;min-width:34px;position:sticky;top:0;z-index:2;font-weight:600;}
  .excel-grid thead th{}
  .excel-grid tbody th{position:sticky;left:0;background:#EDEAE0;z-index:1;min-width:34px;}
  .excel-grid thead th:first-child, .excel-grid tbody th{position:sticky;left:0;z-index:3;}
  .excel-grid td{border:1px solid var(--line);padding:0;min-width:110px;}
  .excel-grid td input{width:100%;min-width:110px;border:none;padding:5px 7px;font-size:12.5px;background:transparent;font-family:'IBM Plex Sans',sans-serif;box-sizing:border-box;}
  .excel-grid td input:focus{outline:2px solid var(--brass);outline-offset:-2px;position:relative;z-index:1;background:#fffdf5;}
  .excel-grid tr:first-child td{background:#FBF6E8;}
  .excel-grid tr:first-child td input{font-weight:600;}

  /* RAG status + visual planning board styling */
  .rag-dot{display:inline-block;width:11px;height:11px;border-radius:50%;flex-shrink:0;}
  .rag-dot.red{background:var(--thread-red);box-shadow:0 0 0 3px var(--thread-red-dim);}
  .rag-dot.amber{background:var(--brass);box-shadow:0 0 0 3px var(--brass-soft);}
  .rag-dot.green{background:var(--green);box-shadow:0 0 0 3px var(--green-soft);}
  .rag-chip{display:inline-flex;align-items:center;gap:6px;font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;background:#fff;border:1px solid var(--line);}
  .critical-badge{display:inline-flex;align-items:center;gap:4px;font-family:'Space Grotesk',sans-serif;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:5px;background:#2B1620;color:#F3B9C3;letter-spacing:0.3px;}
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px;}
  .buyer-overview{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-bottom:4px;}
  .buyer-overview-card{border:1px solid var(--line);border-radius:9px;padding:12px 14px;background:#fff;}
  .buyer-overview-card .bname{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13.5px;margin-bottom:6px;display:flex;align-items:center;gap:7px;}
  .buyer-overview-card .bstats{font-size:11.5px;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
  .gantt{position:relative;height:46px;margin:14px 0 4px;background:linear-gradient(to right, #F2EFE5 0%, #F2EFE5 100%);border-radius:6px;border:1px solid var(--line);}
  .gantt-track{position:absolute;top:22px;left:12px;right:12px;height:2px;background:var(--line);}
  .gantt-node{position:absolute;top:14px;width:16px;height:16px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:default;transform:translateX(-50%);}
  .gantt-node.done{background:var(--green);}
  .gantt-node.overdue{background:var(--thread-red);}
  .gantt-node.progress{background:var(--brass);}
  .gantt-node.pending{background:#B7BECD;}
  .gantt-node.today-marker{background:var(--ink);width:3px;height:26px;border-radius:2px;top:8px;border:none;box-shadow:none;}
  .gantt-labels{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);padding:0 12px;}
  ::placeholder{color:#A6AFC0;}
  @media(max-width:640px){
    .app{padding:18px 12px 60px;}
    .tabs{overflow-x:auto;flex-wrap:nowrap;}
    .header-top{flex-direction:column;}
    .brand-divider{display:none;}
    .brand-row{flex-wrap:wrap;}
    .whoami{text-align:left;width:100%;}
  }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="loading" id="loadingMsg">Loading TNA data…</div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   TNA — Time & Action System for Merchandising
   Roles: admin (all buyers) · manager (assigned buyers, full
   dashboard for those buyers) · member (their own tasks only)
   ============================================================ */

const STORAGE_KEY = 'tna_data_v2';
const ACTIVE_USER_KEY = 'tna_active_user_id_v2';
const DEPARTMENTS = ['Merchandising','Purchase','Store','Shipping','PPC'];

// The admin/manager-tier screens. Admin always has all of them; a Manager's set is
// chosen individually by Admin per person (defaults to all of them if never configured).
const TAB_DEFS = [
  ['dashboard','Dashboard'],
  ['orders','Orders'],
  ['performance','Performance'],
  ['team','Buyers & Team'],
  ['templates','Task Templates'],
  ['notify','Notifications'],
  ['consumption','Consumption Calculator'],
];
function defaultTabAccess(){ return TAB_DEFS.map(([id])=>id); }
function userTabAccess(u){
  if(!u) return [];
  if(u.role==='admin') return defaultTabAccess();
  if(u.role==='manager') return (u.tabAccess && u.tabAccess.length) ? u.tabAccess : defaultTabAccess();

/* ---- PDF export (built on core jsPDF only — no autotable plugin dependency, for reliability) ----
   The PDF library is loaded on demand, only when someone clicks an Export PDF button — never
   blocking page load — so the rest of the app always works instantly with no internet dependency. */
let jsPdfLoadPromise = null;
function loadJsPdfLib(){
  if(window.jspdf) return Promise.resolve(true);
  if(jsPdfLoadPromise) return jsPdfLoadPromise;
  jsPdfLoadPromise = new Promise((resolve) => {
    const timeout = setTimeout(() => { resolve(false); }, 8000);
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    script.onload = () => { clearTimeout(timeout); resolve(!!window.jspdf); };
    script.onerror = () => { clearTimeout(timeout); resolve(false); };
    document.head.appendChild(script);
  });
  return jsPdfLoadPromise;
}
/* ---- Excel (.xlsx) download/upload — loaded on demand, same safe pattern as the PDF library ---- */
let xlsxLoadPromise = null;
function loadXlsxLib(){
  if(window.XLSX) return Promise.resolve(true);
  if(xlsxLoadPromise) return xlsxLoadPromise;
  xlsxLoadPromise = new Promise((resolve) => {
    const timeout = setTimeout(() => { resolve(false); }, 8000);
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    script.onload = () => { clearTimeout(timeout); resolve(!!window.XLSX); };
    script.onerror = () => { clearTimeout(timeout); resolve(false); };
    document.head.appendChild(script);
  });
  return xlsxLoadPromise;
}
/* ---- PDF reading (pdf.js) — for the Consumption Calculator's Automatic mode, which
   extracts marker Length/Width/Sets straight out of an uploaded CAD marker PDF instead
   of someone retyping them. Pinned to the 2.x line specifically because that's the last
   major version cdnjs mirrors as a classic global-exposing script (window.pdfjsLib) —
   3.x+ ships ES-module-only builds there, which a plain <script> tag can't consume the
   same way jsPDF/xlsx/Chart.js are loaded elsewhere in this file. */
let pdfJsLoadPromise = null;
function loadPdfJsLib(){
  if(window.pdfjsLib) return Promise.resolve(true);
  if(pdfJsLoadPromise) return pdfJsLoadPromise;
  pdfJsLoadPromise = new Promise((resolve) => {
    const timeout = setTimeout(() => { resolve(false); }, 10000);
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js';
    script.onload = () => {
      clearTimeout(timeout);
      if(!window.pdfjsLib){ resolve(false); return; }
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
      resolve(true);
    };
    script.onerror = () => { clearTimeout(timeout); resolve(false); };
    document.head.appendChild(script);
  });
  return pdfJsLoadPromise;
}
// Pulls every page's text out of an uploaded marker PDF, joined into one string for
// parseMarkerPdfText() to search. Returns null if the library couldn't load — callers
// show that as "couldn't read this PDF, try Manual mode" rather than crashing.
async function extractPdfText(file){
  const ok = await loadPdfJsLib();
  if(!ok || !window.pdfjsLib) return null;
  try{
    const buf = await file.arrayBuffer();
    const doc = await window.pdfjsLib.getDocument({ data: buf }).promise;
    let text = '';
    for(let i=1; i<=doc.numPages; i++){
      const page = await doc.getPage(i);
      const content = await page.getTextContent();
      text += content.items.map(it => it.str).join(' ') + '\n';
    }
    return text;
  }catch(e){
    console.error('extractPdfText error:', e);
    return null;
  }
}
/* ---- Charts (Chart.js) — loaded on demand, same safe pattern as the PDF/Excel libraries ---- */
let chartJsLoadPromise = null;
function loadChartJsLib(){
  if(window.Chart) return Promise.resolve(true);
  if(chartJsLoadPromise) return chartJsLoadPromise;
  chartJsLoadPromise = new Promise((resolve) => {
    const timeout = setTimeout(() => { resolve(false); }, 8000);
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js';
    script.onload = () => { clearTimeout(timeout); resolve(!!window.Chart); };
    script.onerror = () => { clearTimeout(timeout); resolve(false); };
    document.head.appendChild(script);
  });
  return chartJsLoadPromise;
}
// One place to destroy+recreate every chart instance, keyed by canvas id — every
// render rebuilds the DOM from scratch (fresh canvas nodes), so the previous
// Chart.js instance bound to the old node must be explicitly destroyed or it just
// leaks (and Chart.js logs a re-use warning on the id) each time a filter changes.
const chartInstances = {};
function destroyChart(id){
  if(chartInstances[id]){ chartInstances[id].destroy(); delete chartInstances[id]; }
}
// Shared look for every chart on the site — matches the app's own type/ink tokens
// instead of Chart.js defaults, so charts read as part of the same design, not a
// bolted-on widget.

async function downloadExcelTemplate(headers, exampleRows, filename){
  const ok = await loadXlsxLib();
  if(!ok || !window.XLSX){ showToast('Could not load the Excel library — check your internet connection and try again'); return; }
  const ws = window.XLSX.utils.aoa_to_sheet([headers, ...exampleRows]);
  ws['!cols'] = headers.map(()=>({wch:20}));
  const wb = window.XLSX.utils.book_new();
  window.XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
  window.XLSX.writeFile(wb, filename);
}
// Reads any uploaded Excel/CSV file and hands back the same tab-separated text
// our existing paste parsers already understand — so upload and copy/paste both
// flow through identical, already-tested parsing logic.
async function readExcelFileAsTsv(file){
  const ok = await loadXlsxLib();
  if(!ok || !window.XLSX){ showToast('Could not load the Excel library — check your internet connection and try again'); return null; }
  const buf = await file.arrayBuffer();
  const wb = window.XLSX.read(buf, {type:'array', cellDates:true});
  const firstSheetName = wb.SheetNames[0];
  const ws = wb.Sheets[firstSheetName];
  return window.XLSX.utils.sheet_to_csv(ws, {FS:'\t', blankrows:false});
}
function formatDateForExcel(iso){
  if(!iso) return '';
  const d = new Date(iso+'T00:00:00');
  return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
}

async function pdfNewDoc(title, subtitle){
  const ok = await loadJsPdfLib();
  if(!ok || !window.jspdf){ showToast('Could not load the PDF library — check your internet connection and try again'); return null; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({orientation:'landscape', unit:'pt', format:'a4'});
  doc.setFont('helvetica','bold'); doc.setFontSize(15);
  doc.text(title, 40, 36);
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(100);
  doc.text((subtitle ? subtitle + '  ·  ' : '') + 'Generated ' + new Date().toLocaleString(), 40, 52);
  doc.setTextColor(0);
  return doc;
}
function pdfSectionTitle(doc, y, text){
  doc.setFont('helvetica','bold'); doc.setFontSize(11);
  doc.text(text, 40, y);
  doc.setFont('helvetica','normal');
  return y + 14;
}
function pdfTable(doc, y, headers, rows, colWidths, marginLeft){
  marginLeft = marginLeft || 40;
  const pageHeight = doc.internal.pageSize.getHeight();
  const pageWidth = doc.internal.pageSize.getWidth();
  const rowHeight = 16;
  doc.setFontSize(8);
  const totalWidth = colWidths.reduce((a,b)=>a+b,0);

  function drawHeader(yy){
    doc.setFillColor(23,35,58);
    doc.rect(marginLeft, yy, totalWidth, rowHeight, 'F');
    doc.setTextColor(255); doc.setFont('helvetica','bold');
    let cx = marginLeft;
    headers.forEach((h,i)=>{ doc.text(String(h), cx+4, yy+11); cx += colWidths[i]; });
    doc.setTextColor(0); doc.setFont('helvetica','normal');
  }
  drawHeader(y);
  y += rowHeight;
  rows.forEach((row, ri) => {
    if(y > pageHeight - 40){ doc.addPage(); y = 40; drawHeader(y); y += rowHeight; }
    if(ri % 2 === 1){ doc.setFillColor(245,242,234); doc.rect(marginLeft, y, totalWidth, rowHeight, 'F'); }
    let cx = marginLeft;
    row.forEach((cell,i)=>{
      let text = String(cell===null||cell===undefined?'—':cell);
      const maxChars = Math.floor(colWidths[i]/4.3);
      if(text.length > maxChars) text = text.slice(0, maxChars-1) + '…';
      doc.text(text, cx+4, y+11);
      cx += colWidths[i];
    });
    doc.setDrawColor(220); doc.line(marginLeft, y+rowHeight, marginLeft+totalWidth, y+rowHeight);
    y += rowHeight;
  });
  return y + 16;
}

// Migrate older saves (flat DATA.templates) into the new templateSets structure
function migrateData(d){
  if(!d.buyers) d.buyers = [];
  if(!d.users) d.users = [];
  if(!d.orders) d.orders = [];
  if(!d.templateSets){
    const tasks = (d.templates || DEFAULT_TEMPLATES).map(t => ({id: t.id || uid('tpl'), name:t.name, dept:t.dept, offset:t.offset}));
    d.templateSets = [{id: uid('tplset'), name:'Standard TNA (75 Days)', tasks}];
    delete d.templates;
  }
  // Defensively backfill every field added across versions, so data saved by an
  // older version of the system doesn't crash a newer screen that expects it to exist.
  d.templateSets.forEach(set => {
    (set.tasks||[]).forEach(t => {
      if(t.dependsOn === undefined) t.dependsOn = null;
      // Effort — estimated person-days of actual work this task takes, distinct from
      // "offset" (calendar days before PCD it's scheduled). A task can sit 20 calendar
      // days out but only take half a day of real work, or vice versa — workload views
      // need this, not the scheduling offset, to reflect who's actually carrying load.
      if(t.effort === undefined) t.effort = 1;
    });
  });
  d.users.forEach(u => {
    if(u.managedBuyerIds === undefined) u.managedBuyerIds = [];
    if(u.allowedTaskNames === undefined) u.allowedTaskNames = [];
    if(u.designation === undefined) u.designation = '';
    if(u.tabAccess === undefined) u.tabAccess = [];
    if(u.photo === undefined) u.photo = '';
    if(u.dept === undefined) u.dept = null;
    if(u.buyerId === undefined) u.buyerId = null;
    // buyerIds (a list) replaces buyerId (one) so a member can be assigned to
    // several buyers on one account instead of needing a separate login per
    // buyer. Existing single-buyer assignments convert straight across —
    // nobody's current access changes. allBuyers is for roles like Purchase,
    // Store, Shipping, PPC that work across every buyer, current and future —
    // it defaults to false for everyone already in the system, so nothing
    // changes automatically; an admin turns it on per person afterward.
    if(u.buyerIds === undefined) u.buyerIds = u.buyerId ? [u.buyerId] : [];
    if(u.allBuyers === undefined) u.allBuyers = false;
    if(u.email === undefined) u.email = '';
    if(u.phone === undefined) u.phone = '';
  });
  d.buyers.forEach(b => { if(b.active === undefined) b.active = true; });
  d.orders.forEach(o => {
    if(o.fabricRequiredQty !== undefined) delete o.fabricRequiredQty;
    if(o.trimRequiredQty !== undefined) delete o.trimRequiredQty;
    if(o.season === undefined) o.season = '';
    if(o.qty === undefined) o.qty = '';
    if(o.poNumber === undefined) o.poNumber = '';
    if(o.templateSetName === undefined) o.templateSetName = '';
    if(!Array.isArray(o.tasks)) o.tasks = [];
    // Backfill offsetDays on older TNA tasks (from before PCD editing existed) so
    // changing PCD later can still recalculate them. BOM/material tasks don't need this —
    // their Required I/H date is always read live from order.pcd directly.
    o.tasks.forEach(t => {
      if(t.status === undefined) t.status = 'Pending';
      if(t.remarks === undefined) t.remarks = '';
      if(!Array.isArray(t.history)) t.history = [];
      if(t.dependsOn === undefined) t.dependsOn = null;
      if(t.actualDate === undefined) t.actualDate = null;
      if(t.assignedTo === undefined) t.assignedTo = null;
      if(t.materialType === undefined) t.materialType = null;
      // Expected Date is the field teams actually edit day-to-day; System Estimated
      // (plannedDate) stays the untouched system calculation. Older saves only had
      // one date field, so treat that as both to start with.
      if(t.expectedDate === undefined) t.expectedDate = t.plannedDate;
      if(t.expectedDateManuallySet === undefined) t.expectedDateManuallySet = false;
      if(t.materialType){
        if(t.unit === undefined) t.unit = '';
        if(t.supplier === undefined) t.supplier = '';
        if(t.requiredQty === undefined) t.requiredQty = null;
        if(t.receivedQty === undefined) t.receivedQty = null;
        return;
      }
      if(t.effortDays === undefined){
        let matchedTemplate = null;
        d.templateSets.forEach(set => { const m = (set.tasks||[]).find(st=>st.id===t.templateId); if(m) matchedTemplate = m; });
        t.effortDays = matchedTemplate && matchedTemplate.effort ? matchedTemplate.effort : 1;
      }
      if(t.offsetDays !== undefined) return;
      let matchedTemplate = null;
      d.templateSets.forEach(set => { const m = (set.tasks||[]).find(st=>st.id===t.templateId); if(m) matchedTemplate = m; });
      t.offsetDays = matchedTemplate ? matchedTemplate.offset : (o.pcd && t.plannedDate ? daysBetween(o.pcd, t.plannedDate) * -1 : 0);
    });
  });
  return d;
}

function loadFirebaseMessaging(){
  if(window.firebase && window.firebase.messaging) return Promise.resolve(true);

async function detectBackendApi(){
  try{
    const res = await fetch(BACKEND_API_URL + '?key=__ping__', {method:'GET', headers: backendHeaders()});
    USING_BACKEND_API = res.ok;
  }catch(e){
    USING_BACKEND_API = false;
  }
  USING_LOCAL_FALLBACK = !USING_BACKEND_API && !HAS_CLAUDE_STORAGE;
}

async function backendGet(key){
  const res = await fetch(BACKEND_API_URL + '?key=' + encodeURIComponent(key), {headers: backendHeaders()});
  if(!res.ok) throw new Error('Backend GET failed');
  const data = await res.json();
  return { value: data.value || null, rev: data.rev || 0 };
}
// expectedRev is the revision this client last read. The API does an atomic
// compare-and-swap: if someone else saved in between, this is refused (409) instead
// of silently overwriting their change — see the conflict handling in saveData().
// Passing no expectedRev falls back to an unconditional overwrite (used by the
// "reset and start fresh" flow, which is explicitly meant to force it).
async function backendSet(key, value, expectedRev){
  const res = await fetch(BACKEND_API_URL, {
    method: 'POST',
    headers: backendHeaders({'Content-Type': 'application/json'}),
    body: JSON.stringify({key, value, expectedRev})
  });
  if(res.status === 409){
    const data = await res.json().catch(()=>({}));
    const err = new Error('Backend save conflict');
    err.isConflict = true;
    err.serverValue = data.value;
    err.serverRev = data.rev;
    throw err;
  }
  if(!res.ok) throw new Error('Backend POST failed');
  const data = await res.json();
  return data.rev;
}

async function storageGet(key){
  // Once we're in backend mode, a failed GET must surface as a failure — falling
  // through to local storage here would silently read an unrelated (usually empty)
  // copy, which loadData() would then mistake for "no data yet" and overwrite the
  // real shared data with a blank slate. Let the caller decide how to handle it.
  if(USING_BACKEND_API){
    return await backendGet(key);
  }
  if(HAS_CLAUDE_STORAGE){
    const res = await window.storage.get(key, true);
    return { value: res ? res.value : null, rev: null };
  }
  try{ return { value: localStorage.getItem('claude_fallback__' + key), rev: null }; }catch(e){ return { value: null, rev: null }; }
}
// Returns the new revision (backend mode) or null (local-only modes, which have no
// concurrent-writer risk to guard against — a single browser can't race itself).
async function storageSet(key, value, expectedRev){
  // Same reasoning as storageGet: in backend mode a failed save must be reported
  // to the caller (saveData() shows a toast), not silently redirected to a local
  // copy the rest of the team will never see.
  if(USING_BACKEND_API){
    return await backendSet(key, value, expectedRev);
  }
  if(HAS_CLAUDE_STORAGE){
    await window.storage.set(key, value, true);
    return null;
  }
  localStorage.setItem('claude_fallback__' + key, value);
  return null;
}
async function personalStorageGet(key){
  if(HAS_CLAUDE_STORAGE){
    const res = await window.storage.get(key, false);
    return res ? res.value : null;
  }
  try{ return localStorage.getItem('claude_fallback_personal__' + key); }catch(e){ return null; }
}
async function personalStorageSet(key, value){
  if(HAS_CLAUDE_STORAGE){
    await window.storage.set(key, value, false);
    return;
  }
  localStorage.setItem('claude_fallback_personal__' + key, value);
}

// Set when loadData() could not confirm what's actually saved (network/server error,
// or corrupted JSON) — as opposed to a confirmed-empty first run. init() checks this
// and shows a retry screen instead of the app, specifically so nobody edits a blank
// slate that then gets saved over real shared data.
let DATA_LOAD_FAILED = false;
// The revision last read from the backend for the current DATA — passed back on save
// so the server can detect whether someone else saved in between (see saveData() and
// api/data.js). null in local-only storage modes, which can't race against another
// writer, so there's nothing to guard against.
let DATA_REV = null;

// SHA-256 with a random per-user salt, via the browser's built-in Web Crypto API —
// no external library needed, consistent with this app's zero-dependency approach.
// Framed honestly: this stops a password from being trivially readable off an admin's
// screen or a raw data export, which is the real exposure this app has today. It is
// not a claim of bank-grade security — this app already ships every user record to
// the browser before login (see the storage-layer comment above), so a determined
// attacker who already has that access has the hash too. Salting still blocks the
// cheap attack (rainbow tables / shared passwords across users), which is the
// realistic threat here.
async function hashPassword(password, salt){
  const enc = new TextEncoder().encode(salt + ':' + password);
  const digest = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2,'0')).join('');
}
function randomSalt(){
  const bytes = crypto.getRandomValues(new Uint8Array(16));
  return Array.from(bytes).map(b => b.toString(16).padStart(2,'0')).join('');
}
// Replaces any user's plaintext `password` field with `passwordHash`/`passwordSalt` and
// removes the plaintext. Safe to run every load — a user with no plaintext field left
// is skipped, so this is a no-op once everyone's migrated.
async function migratePasswordsToHashed(d){
  let migrated = false;
  for(const u of d.users){
    if(u.password !== undefined){
      const salt = randomSalt();
      u.passwordHash = await hashPassword(u.password, salt);
      u.passwordSalt = salt;
      delete u.password;
      migrated = true;
    }
  }
  return migrated;
}

async function loadData(){
  await detectBackendApi();
  DATA_LOAD_FAILED = false;
  let loaded;
  try{
    loaded = await storageGet(STORAGE_KEY);
  }catch(e){
    console.error('TNA data load failed:', e);
    DATA_LOAD_FAILED = true;
    DATA = defaultData(); // just enough to avoid null-checks elsewhere — never saved
    return;
  }
  if(loaded.value){
    try{ DATA = JSON.parse(loaded.value); }
    catch(e){
      // Data came back but isn't valid JSON — corrupted, not absent. Don't paper
      // over it by saving fresh defaults on top of whatever is actually stored.
      console.error('TNA data parse failed:', e);
      DATA_LOAD_FAILED = true;
      DATA = defaultData();
      return;
    }
  } else {
    // Backend/storage responded successfully and confirmed there's genuinely
    // nothing saved yet — safe to initialize. Saving is deferred until after the
    // password-hashing step below, so the seed admin password is never written
    // to storage in plaintext even for a moment.
    DATA = defaultData();
  }
  DATA_REV = loaded.rev;
  DATA = migrateData(DATA);
  // Hashes any user still carrying a plaintext password — a brand-new install's seed
  // admin account, or an existing account from before this change (or restored from an
  // older backup). Runs on every load, so nothing plaintext survives past the first
  // save either way.
  const passwordsMigrated = await migratePasswordsToHashed(DATA);
  if(!loaded.value || passwordsMigrated) await saveData();
  try{
    const value2 = await personalStorageGet(ACTIVE_USER_KEY);
    if(value2){ ACTIVE_USER_ID = value2; }
  }catch(e){ /* no active session saved yet */ }
}

async function saveData(){
  try{
    const newRev = await storageSet(STORAGE_KEY, JSON.stringify(DATA), DATA_REV);
    if(newRev !== null) DATA_REV = newRev;
  }catch(e){
    if(e && e.isConflict){
      // Someone else saved in between — the backend refused this write instead of
      // silently overwriting theirs (see api/data.js). The edit that was just
      // attempted here is NOT reapplied automatically — merging two people's changes
      // safely isn't something this app can do on its own — but nothing is lost
      // quietly either: the latest data goes on screen and whoever was mid-edit sees
      // clearly that they need to redo it.
      showToast("Someone else just saved changes here — refreshed to the latest version. Please redo your last change if it didn't take.");
      console.warn('Save conflict — refreshing to latest before retrying anything.');
      try{
        if(e.serverValue){ DATA = migrateData(JSON.parse(e.serverValue)); DATA_REV = e.serverRev; }
        else { await loadData(); }
        render();
      }catch(e2){ console.error('Conflict recovery failed:', e2); }
      return;
    }
    showToast('Save failed — changes may not persist');
    console.error(e);
  }
}

function fmtDate(iso){

}
function daysBetween(a,b){
  const A = new Date(a+'T00:00:00'), B = new Date(b+'T00:00:00');
  return Math.round((B-A)/86400000);
}
function addDays(iso, n){
  const d = new Date(iso+'T00:00:00');
  d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}

// A small palette so initials avatars are visually distinct but stay on-brand
const AVATAR_COLORS = ['#33508C','#8C5C1F','#4C6E2E','#9B3556','#5B4B8C','#1F7A6E','#B8862E','#3E7A4E'];
function initials(name){
  if(!name) return '?';
  const parts = name.trim().split(/\s+/);
  const first = parts[0] ? parts[0][0] : '';
  const last = parts.length>1 ? parts[parts.length-1][0] : '';
  return (first+last).toUpperCase() || '?';
}
function avatarColor(name){
  let hash = 0;
  for(let i=0;i<(name||'').length;i++) hash = (hash*31 + name.charCodeAt(i)) % AVATAR_COLORS.length;
  return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
}
function avatarHtml(user, size){
  size = size || 'md';
  if(user && user.photo){
    return `<span class="avatar avatar-${size}"><img src="${user.photo}" alt="${(user.name||'').replace(/"/g,'&quot;')}"></span>`;
  }
  const name = (user && user.name) || '?';
  return `<span class="avatar avatar-${size}" style="background:${avatarColor(name)};">${initials(name)}</span>`;
}
// Reads an uploaded image file and shrinks it to a small square-ish thumbnail before
// storing it as base64 — keeps the saved data light regardless of the original photo size.
function resizeImageFile(file, maxSize){
  maxSize = maxSize || 200;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxSize){ h = Math.round(h * maxSize / w); w = maxSize; } }
        else { if(h > maxSize){ w = Math.round(w * maxSize / h); h = maxSize; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = () => reject(new Error('Could not read that image'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('Could not read that file'));
    reader.readAsDataURL(file);
  });
}

const STATUS_OPTIONS = ['Pending','In Progress','Done','Approved','Rejected','N/A'];
const RESOLVED_STATUSES = ['Done','Approved','Rejected','N/A']; // never shows as Overdue, drops off open-task lists
const SUCCESS_STATUSES = ['Done','Approved']; // counts as a positive completion for performance/on-time scoring

function isOrderFullyDone(order){
  return order.tasks.length>0 && order.tasks.every(t => SUCCESS_STATUSES.includes(t.status));
}
// A lightweight confetti burst — pure canvas, no image/GIF asset and no external
// library, so it stays free of network dependency and page weight. Uses the app's
// own palette so it reads as part of the system rather than a bolted-on effect.
// Fires once, for a real milestone (an entire order finishing), not on every save.
function celebrateOrderComplete(){
  const canvas = document.createElement('canvas');
  canvas.style.cssText = 'position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:9999;';
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  document.body.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  const colors = ['#C1443C','#B8862E','#3E7A4E','#2B3A55','#FBF9F4'];
  const particles = Array.from({length: 130}, () => ({
    x: Math.random()*canvas.width,
    y: -20 - Math.random()*canvas.height*0.25,
    w: 5 + Math.random()*4,
    h: 3 + Math.random()*3,
    color: colors[Math.floor(Math.random()*colors.length)],
    vx: (Math.random()-0.5)*2.2,
    vy: 2.5 + Math.random()*3,
    rot: Math.random()*Math.PI*2,
    vrot: (Math.random()-0.5)*0.3,
  }));
  const start = performance.now();
  const duration = 1900;
  function frame(now){
    const elapsed = now - start;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.vy += 0.035; p.rot += p.vrot;
      ctx.save();
      ctx.globalAlpha = elapsed > duration-400 ? Math.max(0, (duration-elapsed)/400) : 1;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    });
    if(elapsed < duration) requestAnimationFrame(frame);
    else canvas.remove();
  }
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){ canvas.remove(); return; }
  requestAnimationFrame(frame);
}
// Called from every task-save handler (regular TNA rows and BOM/material rows) right
// after the mutation and re-render — pulses the row's badge the moment a task first
// becomes Done/Approved, and fires the confetti burst the moment that save is what
// tips the whole order over to 100% complete. wasResolved/wasFullyDone are snapshots
// the caller takes BEFORE mutating task.status, so this can tell a genuine transition
// apart from re-saving something already finished.
function celebrateTaskSave(order, task, wasResolved, wasFullyDone){
  if(!wasResolved && SUCCESS_STATUSES.includes(task.status)){
    const anchor = document.querySelector(`[data-save-task-row="${task.id}"], [data-save-bom-row="${task.id}"]`);
    const anchorRow = anchor ? anchor.closest('tr') : null;
    const badge = anchorRow ? anchorRow.querySelector('.badge') : null;
    if(badge) badge.classList.add('badge-pop');
  }
  if(!wasFullyDone && isOrderFullyDone(order)) celebrateOrderComplete();
}

function statusOptionsHtml(current){
  return STATUS_OPTIONS.map(s=>`<option value="${s}" ${current===s?'selected':''}>${s}</option>`).join('');
}
function statusBadgeClass(status){
  if(status==='Overdue' || status==='Rejected') return 'overdue';
  if(status==='Done' || status==='Approved') return 'done';
  if(status==='In Progress') return 'progress';
  return 'pending'; // Pending, N/A
}
// The status text people actually see — makes clear a task marked Done/Approved/Rejected
// AFTER its expected date isn't quietly counted the same as one finished on time, and shows
// exactly how many days overdue a still-open task currently is. Uses Expected Date (the
// current operative plan) rather than System Estimated Date, since Expected is what the
// responsible team actually committed to once they checked with suppliers/buyers.
function opDate(task){ return task.expectedDate || task.plannedDate; }
function statusDisplayText(task){
  const computed = taskStatusComputed(task);
  const ref = opDate(task);
  if(computed === 'Overdue'){
    return `Overdue — ${daysBetween(ref, today())}d`;
  }
  if(RESOLVED_STATUSES.includes(task.status) && task.status !== 'N/A' && task.actualDate && ref && task.actualDate > ref){
    const late = daysBetween(ref, task.actualDate);
    return `${task.status} — ${late}d late`;
  }
  return computed;
}
// Combines computed status + lateness into the right badge color: overdue tasks and
// late completions both get flagged (not just currently-overdue ones), so a task finished
// after its expected date doesn't quietly look identical to one finished on time.
function taskBadgeClass(task){
  const computed = taskStatusComputed(task);
  if(computed === 'Overdue') return 'overdue';
  const ref = opDate(task);
  if(RESOLVED_STATUSES.includes(task.status) && task.status !== 'N/A' && task.actualDate && ref && task.actualDate > ref){
    return 'progress'; // done, but late — amber, not green
  }
  return statusBadgeClass(computed);
}
// Days the current Expected Date has already slipped past the original System Estimated
// Date — lets you see a plan sliding before the activity is even due, per the "System
// Estimated vs Expected" visibility the spec calls for.
function estimateSlippageDays(task){
  if(!task.plannedDate || !task.expectedDate) return 0;
  const d = daysBetween(task.plannedDate, task.expectedDate);
  return d > 0 ? d : 0;
}
// Signed delay for the explicit "Delay" column: positive = late (vs Expected Date),
// negative = early, 0 = on time / not yet due.
function taskDelayDays(task){
  const ref = opDate(task);
  if(!ref) return 0;
  if(task.actualDate) return daysBetween(ref, task.actualDate);
  if(isOpenTask(task) && ref < today()) return daysBetween(ref, today());
  return 0;
}

// Pushes the Expected Date of anything that depends on `changedTask` forward to match
// its own finish reference (Actual Date once it's done, otherwise Expected Date) — a
// slip in an upstream task (e.g. fabric approval running late) is reflected in what
// comes after it instead of the downstream date silently staying stale. Only ever
// pushes dates LATER, never pulls them earlier — finishing something early doesn't
// yank other people's plans forward without them choosing to. This is a floor, not a
// duration-aware schedule: it doesn't know how many days the dependent task itself
// needs, only that it can't be due before its predecessor is.
function cascadeTaskDelay(order, changedTask){
  const pushed = [];
  const visited = new Set();
  function propagate(fromTask){
    if(visited.has(fromTask.id)) return; // cycle guard, belt-and-braces alongside the UI's own cycle prevention
    visited.add(fromTask.id);
    const finishRef = fromTask.actualDate || fromTask.expectedDate;
    if(!finishRef) return;
    order.tasks.filter(t => t.dependsOn===fromTask.id).forEach(dep => {
      const depRef = dep.expectedDate || dep.plannedDate;
      if(depRef && finishRef > depRef){
        dep.expectedDate = finishRef;
        dep.expectedDateManuallySet = true;
        pushed.push(dep);
        propagate(dep);
      }
    });
  }
  propagate(changedTask);
  return pushed;
}

function taskStatusComputed(task){
  if(RESOLVED_STATUSES.includes(task.status)) return task.status;
  if(opDate(task) < today()) return 'Overdue';
  return task.status || 'Pending';
}
function isOpenTask(task){
  return !RESOLVED_STATUSES.includes(task.status);
}
function qtyPercent(task){
  if(!task.materialType || !task.requiredQty) return null;
  return Math.round(((task.receivedQty||0) / task.requiredQty) * 100);
}
function balanceQty(task){
  if(!task.materialType || !task.requiredQty) return null;
  return Math.max(0, task.requiredQty - (task.receivedQty||0));
}
function qtyReadyClass(pct){
  if(pct===null) return '';
  if(pct>=100) return 'done';
  if(pct>=30) return 'progress';
  return 'overdue';
}
// A received-qty percentage as a bold, solidly-filled chip — not just colored text —
// so material readiness reads at a glance: green at 100%+, amber/orange from 30% up
// to just under 100%, red below 30%.
function qtyPctChipHtml(pct){
  if(pct===null) return `<span class="bom-pct-display">—</span>`;
  const bg = pct>=100 ? 'var(--green)' : pct>=30 ? 'var(--brass)' : 'var(--thread-red)';
  return `<span class="bom-pct-display" style="display:inline-block;padding:3px 10px;border-radius:5px;background:${bg};color:#fff;font-weight:700;font-family:'Space Grotesk',sans-serif;font-size:12.5px;">${pct}%</span>`;
}

// RAG (Red/Amber/Green) health of an order — same logic FastReact-style planning boards use
function orderRAG(order){
  const openTasks = order.tasks.filter(isOpenTask);
  const overdue = openTasks.filter(t=>taskStatusComputed(t)==='Overdue');
  if(overdue.length>0) return 'red';
  // Expected Date already past PCD is critical even if not "overdue" yet in the calendar sense
  if(openTasks.some(t=> opDate(t) > order.pcd)) return 'red';
  const dueSoon = openTasks.filter(t=> daysBetween(today(), opDate(t)) <= 3);
  if(dueSoon.length>0) return 'amber';
  // A plan that's already slipping (Expected pushed past System Estimated) before it's even
  // due is an early warning, per the "System Estimated vs Expected" visibility requirement.
  if(openTasks.some(t=> estimateSlippageDays(t) > 0)) return 'amber';
  const qtyTasks = order.tasks.filter(t=>t.materialType);
  if(qtyTasks.some(t=>{ const p=qtyPercent(t); return p!==null && p<100 && opDate(t)<=today(); })) return 'amber';
  return 'green';
}
function ragLabel(rag){ return rag==='red' ? 'At risk' : rag==='amber' ? 'Watch' : 'On track'; }

// The single task on an order with the least slack — the one to chase first
function criticalTask(order){
  const open = order.tasks.filter(isOpenTask);
  if(open.length===0) return null;
  return open.slice().sort((a,b)=> opDate(a) < opDate(b) ? -1 : 1)[0];
}

function renderGanttTimeline(order){
  const tasks = order.tasks;
  if(tasks.length===0) return '';
  const dates = tasks.map(t=>opDate(t));
  const start = dates.reduce((a,b)=> a<b?a:b);
  const end = order.pcd;
  const span = Math.max(1, daysBetween(start, end));
  const todayPct = Math.min(100, Math.max(0, (daysBetween(start, today()) / span) * 100));
  const nodes = tasks.map(t => {
    const pct = Math.min(100, Math.max(0, (daysBetween(start, opDate(t)) / span) * 100));
    const cls = taskBadgeClass(t);
    return `<div class="gantt-node ${cls}" style="left:${pct}%;" title="${t.name} — ${fmtDate(opDate(t))} (${statusDisplayText(t)})"></div>`;
  }).join('');
  return `<div class="gantt">
    <div class="gantt-track"></div>
    ${today()>=start && today()<=end ? `<div class="gantt-node today-marker" style="left:${todayPct}%;" title="Today"></div>` : ''}
    ${nodes}
  </div>
  <div class="gantt-labels"><span>${fmtDate(start)}</span><span>PCD ${fmtDate(end)}</span></div>`;
}

// Error boundary: if any screen throws (usually old saved data that doesn't match
// the latest version), show a clear, actionable message instead of the app just
// silently freezing with no explanation and no way out.
function showRenderError(container, err){
  console.error('TNA render error:', err);
  container.innerHTML = `
    <div class="panel" style="border-color:var(--thread-red-dim);">
      <h2 style="color:var(--thread-red);">Something went wrong showing this screen</h2>
      <p class="desc">The app hit an unexpected error here instead of freezing silently. This is almost always caused by data saved by an older version of the system that doesn't quite match the current one.</p>
      <p class="hint mono" style="white-space:pre-wrap;background:#fff;padding:10px;border-radius:6px;border:1px solid var(--line);">${((err && err.message) ? err.message : String(err)).replace(/</g,'&lt;')}</p>
      <div class="row-actions" style="margin-top:14px;">
        <button class="btn ghost" id="reloadPageBtn">Reload</button>
        <button class="btn danger" id="resetLocalDataBtn">Reset saved data &amp; start fresh</button>
      </div>
      <div class="hint" style="margin-top:10px;">Resetting clears whatever is saved for this system (in this browser, if in Local-only mode) and starts over from a fresh Admin login. Only do this if reloading doesn't fix it.</div>
    </div>`;
  const reloadBtn = container.querySelector('#reloadPageBtn');
  if(reloadBtn) reloadBtn.addEventListener('click', () => location.reload());
  const resetBtn = container.querySelector('#resetLocalDataBtn');
  if(resetBtn) resetBtn.addEventListener('click', async () => {
    if(!confirm('This permanently deletes all saved buyers, orders, users, and templates for this system and starts fresh. This cannot be undone. Continue?')) return;
    try{ localStorage.removeItem('claude_fallback__'+STORAGE_KEY); localStorage.removeItem('claude_fallback_personal__'+ACTIVE_USER_KEY); }catch(e){}
    try{ await personalStorageSet(ACTIVE_USER_KEY, ''); }catch(e){}
    try{
      const fresh = defaultData();
      await migratePasswordsToHashed(fresh); // don't let the seed admin password hit storage in plaintext
      await storageSet(STORAGE_KEY, JSON.stringify(fresh));
    }catch(e){}
    location.reload();
  });
}

function attachGateEvents(){
  const btn = document.getElementById('loginBtn');
  const doLogin = async () => {
    const uname = document.getElementById('loginUsername').value.trim().toLowerCase();
    const pass = document.getElementById('loginPassword').value;
    if(!uname || !pass){ loginError = 'Username or password is incorrect.'; render(); return; }
    // Re-fetch the latest data before checking credentials. This browser tab
    // may have been sitting open (or cached) since before an admin removed
    // this account — without this refresh, the login check would run against
    // the stale in-memory copy from whenever the page first loaded, letting a
    // removed username/password still work on that device.
    btn.disabled = true; btn.textContent = 'Checking…';
    try{ await loadData(); }
    catch(e){ /* if the refresh itself fails, fall back to whatever's already in memory rather than blocking login entirely */ }
    btn.disabled = false; btn.textContent = 'Sign in';
    const candidate = DATA.users.find(u => u.username && u.username.toLowerCase()===uname);
    const match = (candidate && candidate.passwordSalt && await hashPassword(pass, candidate.passwordSalt) === candidate.passwordHash) ? candidate : null;
    if(!match){ loginError = 'Username or password is incorrect.'; render(); return; }
    loginError = '';
    await setActiveUser(match.id);
    currentTab = isManagerOrAdmin() ? 'dashboard' : 'mytasks';
    applyPendingDeepLink();
    render();
  };
  btn.addEventListener('click', doLogin);
  document.getElementById('loginPassword').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
}

// Fades the tab content in, but only right after a genuine tab switch (see
// tabJustSwitched) — every other renderTabContent() call (filter changes, saves,
// keystrokes) leaves it alone so the UI doesn't flash on every edit.
function applyTabFadeIn(el){
  if(!tabJustSwitched) return;
  tabJustSwitched = false;
  el.classList.remove('tab-fade-in');
  void el.offsetWidth; // force reflow so the animation restarts even if the class never left
  el.classList.add('tab-fade-in');
}
// Animates each Dashboard KPI tile's number counting up from 0 on render, instead of
// just appearing — cheap, automatic, and runs on every dashboard render (including
// filter changes), so the numbers visibly "answer" a filter tweak rather than
// silently snapping to a new value.
function animateKpiNumbers(){
  document.querySelectorAll('.kpi-grid .num').forEach(el => {
    const text = el.textContent.trim();
    const match = text.match(/^-?\d+(\.\d+)?/);
    if(!match) return; // e.g. "—" — nothing numeric to animate
    const target = parseFloat(match[0]);
    const suffix = text.slice(match[0].length);
    if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){ return; }
    const duration = 550;
    const start = performance.now();
    function frame(now){
      const t = Math.min(1, (now-start)/duration);
      const eased = 1 - Math.pow(1-t, 3);
      el.textContent = Math.round(target*eased) + suffix;
      if(t<1) requestAnimationFrame(frame);
      else el.textContent = target + suffix;
    }
    requestAnimationFrame(frame);
  });
}

}
function renderAlertBanner(){

  const {overdue, open} = myOverdueOpenTasks();

  // browser permission, two different-looking prompts. One prompt, one flow now.
  const notifHint = (typeof Notification !== 'undefined' && Notification.permission === 'default')
    ? ` Enable notifications above so TNA can tell you about this without needing the app open.` : '';

    ${isManagerOrAdmin() ? 'Open Notifications to send reminders.' : 'Please update them as soon as you can.'}${notifHint}</span>

let alertIntervalStarted = false;
let lastNotifiedOverdueCount = -1;
function setupBrowserAlerts(){
  if(!alertIntervalStarted){
    alertIntervalStarted = true;
    checkAndNotify();
    setInterval(checkAndNotify, 5 * 60 * 1000);
  }
}
function checkAndNotify(){
  if(typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
  // Push notifications already cover this — with more detail (which task, not just a
  // count) and even when this tab/browser is closed. Once this device has a push
  // token registered, this local poll would just be a duplicate, less useful ping —
  // so it only runs as a fallback for whenever push setup hasn't succeeded here.
  if(pushRegisteredOnThisDevice()) return;
  const {overdue} = myOverdueOpenTasks();
  if(overdue.length > 0 && overdue.length !== lastNotifiedOverdueCount){
    lastNotifiedOverdueCount = overdue.length;
    try{ new Notification('TNA — tasks need attention', {body: `You have ${overdue.length} overdue task${overdue.length>1?'s':''}. Open the TNA app to review.`}); }catch(e){}
  }
}

// Every time Remarks is changed and saved, the previous text is kept here instead of
// just being overwritten — this is how buyer/approval comment cycles (submit → buyer
// feedback → revise → resubmit) actually get a record, instead of only ever showing
// whatever the last person typed. Rendered as a native <details> so it costs nothing
// when collapsed and needs no extra toggle-state plumbing.
function taskHistoryHtml(task){
  if(!task.history || task.history.length===0) return '';
  return `<details style="margin-top:4px;">
    <summary style="cursor:pointer;font-size:11px;color:var(--muted);">History (${task.history.length})</summary>
    <div style="margin-top:4px;max-height:130px;overflow-y:auto;">
      ${task.history.slice().reverse().map(h => `<div style="font-size:11.5px;color:var(--muted);padding:4px 0;border-top:1px solid var(--line);">
        <span class="mono">${fmtDate(h.date)}</span> — <strong>${(h.author||'').replace(/</g,'&lt;')}</strong>: ${(h.text||'').replace(/</g,'&lt;')}
      </div>`).join('')}
    </div>
  </details>`;
}

// All distinct task names defined across every T&A template, grouped by department —
// used to let Admin restrict exactly which tasks a Member can be assigned.
function allTaskNamesGrouped(){
  const byDept = {};
  DEPARTMENTS.forEach(d => byDept[d] = new Set());
  DATA.templateSets.forEach(set => {
    set.tasks.forEach(t => { if(byDept[t.dept]) byDept[t.dept].add(t.name); });
  });
  return DEPARTMENTS.map(d => [d, Array.from(byDept[d]).sort()]).filter(([,names]) => names.length>0);
}

// Picks who a task should auto-assign to: prefers a member whose permissions specifically
// include this task name; falls back to any unrestricted member in the right dept/buyer.
function pickDefaultAssignee(buyerId, dept, taskName){
  const candidates = DATA.users.filter(u=>u.role==='member' && userBuyerIds(u).includes(buyerId) && u.dept===dept);
  const restricted = candidates.find(u => (u.allowedTaskNames||[]).includes(taskName));
  if(restricted) return restricted.id;
  const unrestricted = candidates.find(u => !u.allowedTaskNames || u.allowedTaskNames.length===0);
  return unrestricted ? unrestricted.id : null;
}

function groupedUserOptionsHtml(users, selectedId){
  return DEPARTMENTS.map(dept => {

    return `<optgroup label="${dept}">
      ${group.map(u=>`<option value="${u.id}" ${u.id===selectedId?'selected':''}>${u.name} (${buyerNamesDisplay(u)})</option>`).join('')}
    </optgroup>`;
  }).join('');
}

// Applies the Dashboard's Buyer/Person/Style/Season/Date filters to an order.
// Date range checks the order's PCD — the natural "when" for an order-level filter.
function orderMatchesDashboardFilters(order){
  const f = dashboardFilters;
  if(f.buyerId!=='all' && order.buyerId!==f.buyerId) return false;
  if(f.style && !order.styleNo.toLowerCase().includes(f.style.toLowerCase())) return false;
  if(f.season && !(order.season||'').toLowerCase().includes(f.season.toLowerCase())) return false;
  if(f.dateFrom && order.pcd < f.dateFrom) return false;
  if(f.dateTo && order.pcd > f.dateTo) return false;
  return true;
}

  return scopedOrders().filter(orderMatchesDashboardFilters);

// Rule-based "smart insights" for the dashboard — surfaces the handful of patterns
// worth a human's attention out of everything matching the current filter, instead
// of making someone read every chart to notice them. Deliberately deterministic
// (no external model call) so it's instant, free, and always explainable from the
// same data the charts below are drawn from.
function generateDashboardInsights(orders, all){
  const insights = [];

  const deptOverdue = {};
  all.forEach(x => { if(taskStatusComputed(x.task)==='Overdue'){ const d = x.task.dept||'Unassigned'; deptOverdue[d] = (deptOverdue[d]||0)+1; } });
  const worstDept = Object.entries(deptOverdue).sort((a,b)=>b[1]-a[1])[0];
  if(worstDept) insights.push({level:'risk', text:`${worstDept[0]} is carrying the most overdue tasks right now (${worstDept[1]}) — likely bottleneck department.`});

  const buyerRag = {};
  orders.forEach(o => {
    buyerRag[o.buyerId] = buyerRag[o.buyerId] || {red:0, amber:0, green:0, total:0};
    buyerRag[o.buyerId][orderRAG(o)]++;
    buyerRag[o.buyerId].total++;
  });
  const worstBuyerEntry = Object.entries(buyerRag).sort((a,b)=>b[1].red-a[1].red)[0];
  if(worstBuyerEntry && worstBuyerEntry[1].red>0){
    const [bid, c] = worstBuyerEntry;
    insights.push({level:'risk', text:`${buyerName(bid)} has ${c.red} of ${c.total} order${c.total>1?'s':''} at risk — the buyer needing the closest attention.`});
  }

  const atRiskOrders = orders.filter(o => {
    const open = o.tasks.filter(isOpenTask);
    if(open.length===0) return false;
    const daysLeft = daysBetween(today(), o.pcd);
    return daysLeft>=0 && daysLeft<=14 && open.length>daysLeft;
  });
  if(atRiskOrders.length>0){
    insights.push({level:'risk', text:`${atRiskOrders.length} style${atRiskOrders.length>1?'s':''} (e.g. ${atRiskOrders[0].styleNo}) ${atRiskOrders.length>1?'have':'has'} more open tasks left than days until PCD — pace needs to pick up to land on time.`});
  }

  const dueSoonCount = all.filter(x => isOpenTask(x.task) && taskStatusComputed(x.task)!=='Overdue' && daysBetween(today(), opDate(x.task))<=3).length;
  if(dueSoonCount>=5) insights.push({level:'watch', text:`${dueSoonCount} tasks fall due within the next 3 days — a busy stretch coming up.`});

  const workload = dashboardPersonWorkload(all);
  if(workload.length>=2){
    const rest = workload.slice(1);
    const restAvg = rest.reduce((s,e)=>s+e.total,0) / rest.length;
    if(workload[0].total>=3 && workload[0].total >= restAvg*1.5){
      insights.push({level:'watch', text:`${userName(workload[0].userId)} is carrying ${workload[0].total} effort-day${workload[0].total!==1?'s':''} of open work — noticeably more than the rest of the team (avg ${Math.round(restAvg*10)/10}). Worth checking if work needs redistributing.`});
    }
  }

  const cleanBuyers = Object.entries(buyerRag).filter(([,c]) => c.total>0 && c.red===0 && c.amber===0).sort((a,b)=>b[1].total-a[1].total);
  if(cleanBuyers.length>0){
    const [bid, c] = cleanBuyers[0];
    insights.push({level:'good', text:`${buyerName(bid)} — all ${c.total} order${c.total>1?'s':''} on track, no risk flags.`});
  }

  if(insights.length===0) insights.push({level:'good', text:'No major risk patterns in the current filter — everything is tracking cleanly.'});
  return insights.slice(0,5);
}
function insightRowHtml(i){
  const dotClass = i.level==='risk' ? 'red' : i.level==='watch' ? 'amber' : 'green';
  return `<div style="display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;background:#fff;border:1px solid var(--line);">
    <span class="rag-dot ${dotClass}" style="margin-top:4px;"></span>
    <span style="font-size:13.5px;color:var(--ink-soft);line-height:1.5;">${i.text}</span>
  </div>`;
}

// Per-buyer stats for the risk-matrix bubble chart, scoped to whatever orders the
// dashboard filter currently returns (not the buyer's full order book) — so the
// chart never disagrees with the KPIs and insights sitting right above it.
function dashboardBuyerRiskData(orders){
  const map = new Map();
  orders.forEach(o => {
    if(!map.has(o.buyerId)) map.set(o.buyerId, {buyerId:o.buyerId, orders:0, red:0, amber:0, green:0, tasks:[]});
    const e = map.get(o.buyerId);
    e.orders++;
    e[orderRAG(o)]++;
    o.tasks.forEach(t => e.tasks.push(t));
  });
  return Array.from(map.values()).map(e => {
    const done = e.tasks.filter(t => SUCCESS_STATUSES.includes(t.status));
    const onTime = done.filter(t => t.actualDate && t.actualDate<=opDate(t));
    const overdueOpen = e.tasks.filter(t => taskStatusComputed(t)==='Overdue');
    return { ...e, onTimeRate: done.length ? Math.round((onTime.length/done.length)*100) : 100, overdueOpen: overdueOpen.length };
  });
}
// Open/due-soon/overdue/done counts per department, for the workload stacked bar.
function dashboardDeptWorkload(all){
  const map = {};
  DEPARTMENTS.forEach(d => map[d] = {overdue:0, dueSoon:0, onTrack:0, done:0});
  all.forEach(x => {
    const d = x.task.dept;
    if(!map[d]) return;
    if(SUCCESS_STATUSES.includes(x.task.status)) map[d].done++;
    else if(taskStatusComputed(x.task)==='Overdue') map[d].overdue++;
    else if(isOpenTask(x.task) && daysBetween(today(), opDate(x.task))<=3) map[d].dueSoon++;
    else if(isOpenTask(x.task)) map[d].onTrack++;
  });
  return DEPARTMENTS.map(d => ({dept:d, ...map[d]})).filter(e => e.overdue+e.dueSoon+e.onTrack+e.done>0);
}
// Per-person open workload, weighted by each task's effort (person-days), not just
// task count — a task's effortDays comes from its template (see Task Templates);
// anything without one (older data, ad-hoc BOM/material lines) falls back to 1 so
// it still counts instead of silently vanishing from the total. Sorted heaviest
// first, capped to the busiest 15 people so the chart stays readable.
function dashboardPersonWorkload(all){
  const map = new Map();
  all.forEach(x => {
    if(!isOpenTask(x.task) || !x.task.assignedTo) return;
    const uid = x.task.assignedTo;
    if(!map.has(uid)) map.set(uid, {userId:uid, overdue:0, dueSoon:0, onTrack:0});
    const e = map.get(uid);
    const effort = x.task.effortDays || 1;
    if(taskStatusComputed(x.task)==='Overdue') e.overdue += effort;
    else if(daysBetween(today(), opDate(x.task))<=3) e.dueSoon += effort;
    else e.onTrack += effort;
  });
  return Array.from(map.values())
    .map(e => ({...e, total: e.overdue+e.dueSoon+e.onTrack}))
    .sort((a,b) => b.total-a.total)
    .slice(0,15);
}
// One point per open task, for the "who/how much/when" scatter under the Team
// workload bar — x is days from today (negative = overdue) rather than a real
// Chart.js time scale, so this needs no date-adapter library; y is that task's
// row index in the SAME person list dashboardPersonWorkload() returns, so the two
// charts always list people in identical top-to-bottom order. Bubble radius carries
// effort, color carries urgency — so "how much" and "when" both read at a glance
// without opening a second screen.
function dashboardWorkloadTimeline(all){
  const people = dashboardPersonWorkload(all);
  const rowOf = new Map(people.map((p,i) => [p.userId, i]));
  const points = [];
  all.forEach(x => {
    if(!isOpenTask(x.task) || !x.task.assignedTo) return;
    const row = rowOf.get(x.task.assignedTo);
    if(row===undefined) return;
    const due = opDate(x.task);
    if(!due) return;
    const level = taskStatusComputed(x.task)==='Overdue' ? 'overdue' : daysBetween(today(), due)<=3 ? 'dueSoon' : 'onTrack';
    const effort = x.task.effortDays || 1;
    points.push({
      x: daysBetween(today(), due), y: row, r: Math.max(5, Math.min(18, 4 + effort*2.5)),
      level, effort, taskName: x.task.name, styleNo: x.order.styleNo, dueDate: due,
    });
  });
  return { people, points };
}
// Open-task counts bucketed into the next 6 calendar weeks (Mon–Sun, starting this
// week) — a capacity look-ahead so a heavy week can be spotted before it arrives.
function dashboardUpcomingWeeks(all){
  const dt = new Date(today()+'T00:00:00Z');
  const dow = (dt.getUTCDay()+6)%7;
  dt.setUTCDate(dt.getUTCDate()-dow);
  const weekStart0 = dt.toISOString().slice(0,10);
  const weeks = Array.from({length:6}, (_,i) => {
    const start = addDays(weekStart0, i*7);
    return { start, end: addDays(start,6), count:0 };
  });
  all.forEach(x => {
    if(!isOpenTask(x.task)) return;
    const d = opDate(x.task);
    if(!d) return;
    const wk = weeks.find(w => d>=w.start && d<=w.end);
    if(wk) wk.count++;
  });
  return weeks;
}

// Draws all five Dashboard charts into the canvases renderDashboard() just put in the
// DOM. Called after every dashboard render (see attachTabEvents) — recomputes from
// the live filter state itself rather than taking numbers as arguments, since Chart.js
// loads async and the user could switch tabs or change a filter before it resolves;
// the canvas-existence checks below are what make that race harmless.
async function initDashboardCharts(){
  if(!document.getElementById('dashRagChart') && !document.getElementById('dashTaskChart')) return;
  const ok = await loadChartJsLib();
  if(!ok || !window.Chart) return;
  initDashboardChartsCore();
  initDashboardAdvancedCharts();
}
function initDashboardChartsCore(){
  const orders = dashboardFilteredOrders();
  const all = dashboardFilteredTasks();
  const overdue = all.filter(x => taskStatusComputed(x.task)==='Overdue');
  const dueSoon = all.filter(x => isOpenTask(x.task) && taskStatusComputed(x.task)!=='Overdue' && daysBetween(today(), opDate(x.task)) <= 3);
  const onTrackOpen = all.filter(x => isOpenTask(x.task) && taskStatusComputed(x.task)!=='Overdue' && daysBetween(today(), opDate(x.task)) > 3);
  const doneTasks = all.filter(x => SUCCESS_STATUSES.includes(x.task.status));
  const onTimeDone = doneTasks.filter(x => x.task.actualDate && x.task.actualDate <= opDate(x.task));
  const lateDone = doneTasks.length - onTimeDone.length;

  const ragCanvas = document.getElementById('dashRagChart');
  destroyChart('dashRagChart');
  if(ragCanvas){
    const counts = {red:0, amber:0, green:0};
    orders.forEach(o => counts[orderRAG(o)]++);
    chartInstances.dashRagChart = new Chart(ragCanvas, {
      type: 'doughnut',
      data: {
        labels: ['At risk','Watch','On track'],
        datasets: [{ data: [counts.red, counts.amber, counts.green], backgroundColor: ['#C1443C','#B8862E','#3E7A4E'], borderColor: '#FBF9F4', borderWidth: 2 }]
      },
      options: {
        responsive: true, maintainAspectRatio: false, cutout: '62%',
        plugins: {
          legend: { position: 'bottom', labels: { font: chartBaseFont(), color: '#2B3A55', padding: 14, usePointStyle: true } },
          tooltip: { callbacks: { label: ctx => ` ${ctx.label}: ${ctx.parsed} order${ctx.parsed!==1?'s':''}` } }
        }
      }
    });
  }

  const taskCanvas = document.getElementById('dashTaskChart');
  destroyChart('dashTaskChart');
  if(taskCanvas){
    const rows = [
      ['Overdue', overdue.length, '#C1443C'],
      ['Due soon', dueSoon.length, '#B8862E'],
      ['On track', onTrackOpen.length, '#8B97AF'],
      ['Done on time', onTimeDone.length, '#3E7A4E'],
      ['Done late', lateDone, '#B8862E'],
    ];
    chartInstances.dashTaskChart = new Chart(taskCanvas, {
      type: 'bar',
      data: {
        labels: rows.map(r=>r[0]),
        datasets: [{ data: rows.map(r=>r[1]), backgroundColor: rows.map(r=>r[2]), borderRadius: 4, maxBarThickness: 34 }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ` ${ctx.parsed.y} task${ctx.parsed.y!==1?'s':''}` } } },
        scales: {
          x: { grid: { display: false }, ticks: { font: chartBaseFont(), color: '#6B7385' } },
          y: { beginAtZero: true, ticks: { precision: 0, font: chartBaseFont(), color: '#6B7385' }, grid: { color: '#EFEBE0' } }
        }
      }
    });
  }
}

          { label: 'Done', data: deptData.map(d=>d.done), backgroundColor: '#3E7A4E' },

      },
      options: {
        indexAxis: 'y', responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'bottom', labels: { font: chartBaseFont(), color: '#2B3A55', usePointStyle: true, padding: 12 } } },
        scales: {
          x: { stacked: true, ticks: { precision: 0, font: chartBaseFont(), color: '#6B7385' }, grid: { color: '#EFEBE0' } },
          y: { stacked: true, ticks: { font: chartBaseFont(), color: '#2B3A55' }, grid: { display: false } }

  const upcomingCanvas = document.getElementById('dashUpcomingChart');
  destroyChart('dashUpcomingChart');
  if(upcomingCanvas){
    const weeks = dashboardUpcomingWeeks(all);
    chartInstances.dashUpcomingChart = new Chart(upcomingCanvas, {
      type: 'bar',
      data: {
        labels: weeks.map(w => fmtDate(w.start).replace(/ \d{4}$/,'')),

  destroyChart('dashWorkloadChart');
  if(workloadCanvas){
    const workload = dashboardPersonWorkload(all);
    chartInstances.dashWorkloadChart = new Chart(workloadCanvas, {
      type: 'bar',
      data: {
        labels: workload.map(e => userName(e.userId)),
        datasets: [
          { label: 'Overdue', data: workload.map(e=>e.overdue), backgroundColor: '#C1443C' },
          { label: 'Due soon', data: workload.map(e=>e.dueSoon), backgroundColor: '#B8862E' },
          { label: 'On track', data: workload.map(e=>e.onTrack), backgroundColor: '#8B97AF' },

      },
      options: {
        indexAxis: 'y', responsive: true, maintainAspectRatio: false,

        },
        scales: {
          x: { stacked: true, title: { display: true, text: 'Effort-days of open work', font: chartBaseFont(), color: '#6B7385' }, ticks: { precision: 0, font: chartBaseFont(), color: '#6B7385' }, grid: { color: '#EFEBE0' } },
          y: { stacked: true, ticks: { font: chartBaseFont(), color: '#2B3A55' }, grid: { display: false } }
        }
      }
    });
  }

  // A dashed "today" line on the timeline below, drawn as a tiny inline Chart.js
  // plugin rather than pulling in the annotation plugin — this is the only thing
  // that plugin would be used for, and the app otherwise loads no Chart.js add-ons.
  const todayLinePlugin = {
    id: 'todayLine',
    afterDraw(chart){
      const xScale = chart.scales.x;
      if(!xScale) return;
      const xPix = xScale.getPixelForValue(0);
      const { top, bottom } = chart.chartArea;
      const ctx = chart.ctx;
      ctx.save();
      ctx.strokeStyle = '#2B3A55';
      ctx.setLineDash([4, 3]);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(xPix, top);
      ctx.lineTo(xPix, bottom);
      ctx.stroke();
      ctx.restore();
    }
  };
  const timelineCanvas = document.getElementById('dashWorkloadTimelineChart');
  destroyChart('dashWorkloadTimelineChart');
  if(timelineCanvas){
    const { people, points } = dashboardWorkloadTimeline(all);
